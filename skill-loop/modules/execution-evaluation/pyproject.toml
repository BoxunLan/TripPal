[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-evaluation"
version = "0.1.0"
description = "B 线：执行与评测（任务包 -> runs -> verdict -> summary）"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["execution_evaluation"]

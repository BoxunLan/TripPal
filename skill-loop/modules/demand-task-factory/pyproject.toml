[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-task-factory"
version = "0.1.0"
description = "A 线：需求与任务（Trends 快照 -> 场景目录 + 任务包）"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["demand_task_factory"]

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TripPal · 来华旅行助手</title>
<style>
/* ============================================================
   配色：浅色为主（DeepSeek 网页端默认），深色走 [data-theme=dark]。
   所有卡片/文字都取变量 —— 这样两套主题不用各写一遍。
   ============================================================ */
:root{
  --acc:#4d6bfe; --acc-2:#3d5ae0; --acc-soft:#eef1ff; --acc-line:#d9e0ff;
  --bg:#ffffff; --bg-side:#f7f8fa; --bg-elev:#ffffff; --bg-sunk:#f7f8fa;
  --fg:#1f2329; --fg-2:#4e5969; --mut:#8b939f; --dim:#aab1bb;
  --line:#e7e9ee; --line-2:#f0f2f5;
  --bubble:#f3f5f9; --bubble-fg:#1f2329;
  --ok:#17a35c; --ok-soft:#e8f7ef; --warn:#c8871a; --warn-soft:#fdf4e3;
  --bad:#d54941; --bad-soft:#fdeceb; --tool:#7a5af8; --tool-soft:#f1edfe;
  --shadow:0 2px 14px rgba(20,30,60,.07);
  --r:12px;
}
[data-theme="dark"]{
  --acc:#6b86ff; --acc-2:#8ea2ff; --acc-soft:#1b2338; --acc-line:#2b365c;
  --bg:#16181d; --bg-side:#111318; --bg-elev:#1b1e24; --bg-sunk:#131519;
  --fg:#e8eaed; --fg-2:#c2c8d2; --mut:#8b939f; --dim:#69707c;
  --line:#282c34; --line-2:#22252b;
  --bubble:#21252c; --bubble-fg:#e8eaed;
  --ok:#3fb96f; --ok-soft:#132b1e; --warn:#e0a637; --warn-soft:#2b2413;
  --bad:#f1685f; --bad-soft:#2e1716; --tool:#a58bff; --tool-soft:#211c33;
  --shadow:0 2px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;}
a{color:var(--acc)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace;font-size:.86em}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   骨架：侧栏 + 主区。主区是列向 flex：消息流滚动，输入区常驻底部。
   ============================================================ */
.app{display:flex;height:100%;overflow:hidden}

/* ---------- 侧栏 ---------- */
.sidebar{width:264px;flex:none;background:var(--bg-side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:margin-left .18s ease}
.sidebar.collapsed{margin-left:-264px}
.brand{display:flex;align-items:center;gap:9px;padding:16px 14px 12px;font-weight:650;font-size:15.5px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--acc);color:#fff;
  display:grid;place-items:center;flex:none}
.brand .mark svg{width:15px;height:15px}
.newchat{margin:2px 12px 12px;display:flex;align-items:center;gap:8px;background:var(--acc);color:#fff;
  border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px;font-weight:550;cursor:pointer}
.newchat:hover{background:var(--acc-2)}
.newchat svg{width:15px;height:15px}
.slist{flex:1;overflow-y:auto;padding:2px 8px 10px}
.sgroup{color:var(--dim);font-size:11.5px;padding:8px 8px 4px;letter-spacing:.02em}
.sitem{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:9px;cursor:pointer;
  color:var(--fg-2);font-size:13.5px;line-height:1.4}
.sitem:hover{background:var(--line-2)}
.sitem.on{background:var(--acc-soft);color:var(--acc);font-weight:550}
.sitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .del{opacity:0;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:15px;
  line-height:1;padding:2px 3px;border-radius:5px;flex:none}
.sitem:hover .del{opacity:.75}
.sitem .del:hover{opacity:1;color:var(--bad);background:var(--bad-soft)}
.side-foot{border-top:1px solid var(--line);padding:11px 13px 13px}
.foot-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mini{color:var(--mut);font-size:11.5px;line-height:1.65}
.mini b{color:var(--fg-2);font-weight:600}
.iconbtn{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;
  width:28px;height:28px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--dim)}
.iconbtn svg{width:15px;height:15px}
#memory{margin-top:9px;max-height:190px;overflow-y:auto;background:var(--bg-elev);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px;line-height:1.7}
#memory[hidden]{display:none}
#memory .mem-h{color:var(--mut)}
#memory .mem-h b{color:var(--fg-2)}
#memory ol{margin:5px 0 0;padding-left:17px;color:var(--mut)}
#memory .mem-tag{display:inline-block;margin-left:5px;padding:0 6px;border-radius:999px;font-size:10.5px;
  border:1px solid var(--line);color:var(--mut)}
#memory .mem-sub{color:var(--acc)}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--bg)}
.topbar .tt{flex:1;min-width:0;font-size:14px;color:var(--fg-2);font-weight:550;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sbbtn{display:none}

/* 消息流。宽度收到 768px —— 与 DeepSeek 一致的阅读宽度，长文本不拉伸成一行到底。 */
.thread{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread-inner{max-width:768px;margin:0 auto;padding:22px 20px 30px}
.msg{display:flex;gap:12px;padding:9px 0}
.msg.user{flex-direction:row-reverse}
.avatar{width:28px;height:28px;flex:none;border-radius:50%;background:var(--acc-soft);color:var(--acc);
  display:grid;place-items:center;margin-top:2px}
.avatar svg{width:16px;height:16px}
.bubble{max-width:min(80%,600px);background:var(--bubble);color:var(--bubble-fg);border-radius:var(--r);
  padding:9px 14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ai-body{flex:1;min-width:0}
.ai-body>p:first-child{margin-top:0}

/* ---------- 首屏 ---------- */
/* 首屏把标题组撑在可视区中部（DeepSeek 首页就是这样：标题居中偏上、输入框在其下），
   有消息后 hero 被隐藏，不影响对话流。 */
.hero{min-height:calc(100vh - 330px);display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:20px 0 30px;text-align:center}
.hero[hidden]{display:none}
.hero h1{font-size:31px;margin:0 0 8px;font-weight:650;letter-spacing:-.01em}
.hero .lead{color:var(--mut);font-size:14.5px;margin:0 0 22px}
.ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px;margin:0 auto}
.chip-ex{background:var(--bg-elev);border:1px solid var(--line);color:var(--fg-2);border-radius:999px;
  padding:6px 13px;font-size:13px;cursor:pointer;transition:.12s}
.chip-ex:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.chip-ex.ex-clarify{border-style:dashed}
.chip-ex.ex-realtime{border-style:dashed;border-color:var(--acc-line)}
.chip-ex.ex-answer{border-style:dashed;border-color:#eddfc4}
.chip-ex.ex-guide{border-style:dashed;border-color:#cfe9dc}

/* ---------- 输入区 ---------- */
.composer-wrap{flex:none;background:var(--bg);padding:0 20px 14px}
.composer-inner{max-width:768px;margin:0 auto}
.composer{background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:12px 12px 10px;transition:border-color .15s}
.composer:focus-within{border-color:var(--acc-line)}
.composer textarea{width:100%;border:0;outline:none;resize:none;background:transparent;color:var(--fg);
  font:inherit;line-height:1.7;max-height:190px;min-height:52px;padding:2px 4px}
.composer textarea::placeholder{color:var(--dim)}
.cacts{display:flex;align-items:center;gap:8px;margin-top:8px}
.cleft{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1;min-width:0}
.pillbtn{display:inline-flex;align-items:center;gap:6px;background:var(--bg-sunk);border:1px solid var(--line);
  color:var(--fg-2);border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;
  white-space:nowrap}
.pillbtn:hover{border-color:var(--dim);color:var(--fg)}
.pillbtn.on{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.pillbtn svg{width:13px;height:13px}
.pillbtn select{background:transparent;border:0;color:inherit;font:inherit;font-size:12.5px;outline:none;
  cursor:pointer;padding:0}
.pillbtn select option{color:#1f2329}
.sendbtn{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:var(--acc);color:#fff;
  display:grid;place-items:center;cursor:pointer;transition:.12s}
.sendbtn:hover{background:var(--acc-2)}
.sendbtn:disabled{background:var(--line);color:var(--dim);cursor:default}
.sendbtn svg{width:17px;height:17px}
.cnote{color:var(--dim);font-size:11.5px;text-align:center;margin:9px 0 0}

/* 行程信息卡：展开在输入框**上方**，像 DeepSeek 的附件预览 ——
   让用户跑去页面顶部找表单，等于没给（填了不经过口语抽取，直接落槽位）。 */
.formcard{margin:0 auto 10px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow)}
.formcard[hidden]{display:none}
.frow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.ftitle{font-size:13px;font-weight:600}
.fnote{color:var(--mut);font-size:11.5px;line-height:1.65}
.fgrid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ff{display:flex;align-items:center;gap:6px;color:var(--fg-2);font-size:12.5px}
.ff input{background:var(--bg-sunk);color:var(--fg);border:1px solid var(--line);border-radius:8px;
  padding:5px 8px;font:inherit;font-size:12.5px;outline:none;width:96px}
.ff input:focus{border-color:var(--acc-line)}
.ff input::placeholder{color:var(--dim)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;
  padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.ghost:hover{color:var(--fg);border-color:var(--dim)}

/* ---------- 思考过程（DeepSeek 的「已深度思考」折叠块） ----------
   本项目的七节点链路正好对应那条思维链：跑的时候展开显示走到第几步，
   跑完折叠成一行「已深度思考（用时 X 秒）」—— 调试信息不占正文位置。 */
.think{margin:2px 0 12px;font-size:13px;color:var(--mut)}
.think>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  user-select:none;color:var(--mut)}
.think>summary::-webkit-details-marker{display:none}
.think>summary:hover{color:var(--fg-2)}
.think[open]>summary{margin-bottom:4px}
.think .sum-ico{width:15px;height:15px;flex:none;display:grid;place-items:center}
.think .sum-ico svg{width:13px;height:13px;color:var(--acc)}
.think-body{padding-left:2px}
.steps{list-style:none;margin:6px 0 0;padding:6px 0 6px 13px;border-left:2px solid var(--line);
  display:grid;gap:6px}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.step .dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
/* 步骤名不设固定宽度：标签长短差很多（「体检必填槽位」vs「判定为实时事实问询 · 未经过」），
   写死宽度会让长标签折成两行、看着像排版坏了。让它按内容宽，右列自己省略。 */
.step .nm{color:var(--dim);flex:0 0 auto;white-space:nowrap}
.step .dt{color:var(--dim);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.run .dot{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.step.run .nm{color:var(--fg-2)}
.step.done .dot{background:var(--ok)}
.step.done .nm{color:var(--fg-2)}
.step.done .dt{color:var(--mut)}
/* 旁路未经过的步骤：实时事实 / 常识问询只走 clarify → 旁路 → output，
   中间五步永远等不到事件。不标出来，进度条会停在那一步看着像卡住。 */
.step.skip{opacity:.45}
.step.skip .nm::after{content:" · 未经过";font-size:11px}
.diag{color:var(--dim);font-size:11.5px;margin-top:7px;line-height:1.7}
.diag.warn{color:var(--warn)}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- AI 消息操作栏（hover 才出现，与 DeepSeek 一致） ---------- */
.ai-actions{display:flex;gap:4px;margin:10px 0 2px;opacity:0;transition:opacity .15s}
.msg.ai:hover .ai-actions,.ai-actions:focus-within{opacity:1}
.ai-actions button{border:0;background:transparent;color:var(--mut);border-radius:7px;width:28px;height:28px;
  display:grid;place-items:center;cursor:pointer}
.ai-actions button:hover{background:var(--bg-sunk);color:var(--fg)}
.ai-actions button.on{color:var(--acc);background:var(--acc-soft)}
.ai-actions svg{width:15px;height:15px}

/* ============================================================
   答复卡片（行程 / 实时 / 常识 / 追问 / 引导）
   对话流里卡片要轻：白底细边圆角，不再用深色实心底。
   ============================================================ */
.card{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.chead{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;
  gap:9px;flex-wrap:wrap}
.chead h2{font-size:16.5px;margin:0;flex:1 1 auto;line-height:1.45;font-weight:650}
.chead .th{color:var(--mut);font-weight:400}
/* 链路元信息（耗时 / 路由 / 语言 …）挪到卡片**末尾**当小字：
   对话流里正文要干净，这些是给开发看的，默认不抢视线。 */
.qbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:12px;padding:10px 16px 12px;
  border-top:1px dashed var(--line);color:var(--mut);font-size:11.5px;line-height:1.7}
.qbar b{color:var(--fg-2);font-weight:600}
.pill{font-size:11.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg-sunk);color:var(--mut);white-space:nowrap}
.pill.acc{color:var(--acc);border-color:var(--acc-line);background:var(--acc-soft)}
.pill.ok{color:var(--ok);border-color:#bfe8d1;background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:#eddcb9;background:var(--warn-soft)}
.pill.bad{color:var(--bad);border-color:#f3cac7;background:var(--bad-soft)}
.pill.tool{color:var(--tool);border-color:#d8ccfb;background:var(--tool-soft)}
[data-theme="dark"] .pill.ok{border-color:#1e4d34}
[data-theme="dark"] .pill.warn{border-color:#4c3d18}
[data-theme="dark"] .pill.bad{border-color:#54231f}
[data-theme="dark"] .pill.tool{border-color:#392d63}
/* 七格统计：用 grid 自动分配，不再写死每格宽度 ——
   flex 写法在 768px 内容宽下会「6 格一行 + 1 格掉到第二行」，最后那格孤零零的。 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));
  border-bottom:1px solid var(--line-2);background:var(--bg-sunk)}
.stats div{padding:9px 13px}
.stats b{display:block;font-size:16px;font-weight:650}
.stats span{color:var(--mut);font-size:11.5px}

.body{padding:15px 16px}
.body h3{font-size:12.5px;color:var(--mut);font-weight:600;margin:18px 0 8px}
.body h3:first-child{margin-top:0}
ul.plain{margin:0;padding-left:19px}
ul.plain li{margin:5px 0;line-height:1.75}

.day{border-left:2px solid var(--line);padding:0 0 4px 14px;margin:0 0 16px}
.day:last-child{margin-bottom:0}
.day .dhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.day .dno{font-weight:650;font-size:14px}
.day .dtheme{color:var(--mut);font-size:12.5px}
.act{display:grid;grid-template-columns:58px 1fr;gap:11px;padding:7px 0;border-top:1px dashed var(--line-2)}
.act:first-of-type{border-top:0}
.act .t{color:var(--mut);font-size:12px;padding-top:1px}
.act .n{font-weight:600}
.act .d{color:var(--fg-2);font-size:12.5px;margin-top:2px;line-height:1.7}
.act .c{color:var(--acc);font-size:12px;margin-top:2px}

.bline{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:6px 0}
.bline .nm{flex:0 0 44%;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bline .bar{flex:1 1 auto;height:7px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bline .bar i{display:block;height:100%;background:var(--acc)}
.bline .am{flex:0 0 68px;text-align:right}
.bsum{margin-top:10px;font-size:12.5px;color:var(--mut)}
.bsum b{color:var(--fg)}

.cites{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--bg-sunk);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mut);cursor:default}
.chip.tool{color:var(--tool);border-color:#d8ccfb;background:var(--tool-soft)}
/* 可点与不可点必须一眼分得开：有官方入口的用强调色 + 外链箭头，
   没有入口的（编辑整理条目）虚线下边框并压暗 —— 「点不了」是事实，别让它看起来像坏了。 */
a.chip{cursor:pointer;text-decoration:none;color:var(--acc);border-color:var(--acc-line);background:var(--acc-soft)}
a.chip:hover{color:var(--acc-ink,var(--acc));border-color:var(--acc);text-decoration:underline}
a.chip::after{content:"\2197";font-size:10px;opacity:.65;margin-left:3px}
.chip.nolink{color:var(--dim);border-style:dashed}
.legend{color:var(--dim);font-size:11.5px;margin-top:7px}

table.v{width:100%;border-collapse:collapse;font-size:12.5px}
table.v th,table.v td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.v th{background:var(--bg-sunk);color:var(--mut);font-weight:500;white-space:nowrap}

.clar .body p{margin:6px 0}
.question{font-size:15.5px;line-height:1.8}
.reason{color:var(--bad)}
.note{line-height:1.8;margin:6px 0}
.aid{color:var(--mut);font-size:12.5px;line-height:1.75;margin:6px 0}
.aid a{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc-line)}
.aid a:hover{border-bottom-style:solid}
/* 「接着可以问」：点一下直接发。对话流里做成一排淡色 chip。 */
.sugbar{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 6px}
.sug{display:inline-block;color:var(--acc);background:var(--acc-soft);border:1px solid var(--acc-line);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;margin:2px 0}
.sug:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
/* 答案块：比「相关条目」重 —— 用户来这儿就是为了这一块。 */
.answerbox{margin:2px 0 14px;padding:13px 15px;border-radius:12px;background:var(--bg-sunk);
  border:1px solid var(--line);border-left:3px solid var(--acc)}
.answerbox .ans{font-size:15px;line-height:1.85;white-space:pre-wrap}
.answerbox .ans.nogive{color:var(--warn)}
.ansmeta{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
.ansmeta .aid{margin:0}

/* 追问卡里的快捷补充：就地在「问你几个人」这一屏填 —— 这是抽不到时的兜底通道。 */

}

</head>
<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2a7.2 7.2 0 0 0-7.2 7.2C4.8 14.6 12 22 12 22s7.2-7.4 7.2-12.8A7.2 7.2 0 0 0 12 2Z" fill="currentColor"/><circle cx="12" cy="9.2" r="2.7" fill="#fff"/></svg></span>
    <span>TripPal 来华助手</span>
  </div>
  <button class="newchat" id="newsess">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    新建对话
  </button>
  <div class="slist" id="slist"></div>
  <div class="side-foot">

    <div class="foot-row" style="margin-top:9px">
      <span class="mini">会话 <span class="mono" id="sidshow"></span></span>
      <button class="iconbtn" id="theme" title="切换深浅色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
      </button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="iconbtn sbbtn" id="sbtoggle" title="会话列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="tt" id="topictitle">新的对话</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
    </button>
  </div>

  <div class="thread" id="thread">
    <div class="thread-inner" id="results">
      <div class="hero" id="hero">
        <h1>来华旅行，问我</h1>
        <p class="lead">行程规划 · 签证与入境 · 支付与网络 · 交通 · 吃喝 · 就医 —— 中英日韩都能问</p>
        <div class="ex" id="exbox"></div>

  <div class="composer-wrap">

        <div class="frow">

          <button class="ghost" id="formclear" style="margin-left:auto">清空已填</button>

          <label class="ff">目的地 <input type="text" id="f-dest" placeholder="厦门"></label>
          <label class="ff">玩几天 <input type="number" id="f-days" min="1" max="60" placeholder="5"></label>

          <label class="ff">成人 <input type="number" id="f-adults" min="0" max="30" placeholder="1"></label>
          <label class="ff">儿童 <input type="number" id="f-children" min="0" max="30" placeholder="0"></label>
          <label class="ff">儿童年龄 <input type="number" id="f-childage" min="0" max="17" placeholder="6"></label>

          同行人四项<b>全留空 = 没填</b>（不会被当成「已知 2 人」）；填任意一项就按「成人+儿童+长者」合计。
          同一句里<b>自己又说了</b>的，以你说的为准 —— 表单只是保底。
          <b>来自（国家）</b>填了就按你的国家做中外类比解释，不填就给通用说明（不会被追问）。
        </div>

        <div class="cacts">

              行程信息卡
            </button>

              <select id="lang">
                <option value="">跟随输入</option>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <p class="cnote">内容由 AI 生成，行程与价格仅供参考；涉及证件、时刻、票价请按给出的官方入口复核。</p>
    </div>
  </div>
  <input type="hidden" id="sid">
</main>
</div>

<script>
/* ==========================================================================
   示例：每条带预期结果，点一下直接发。
   种子库覆盖 厦门 / 清迈 / 北京 + 来华政策（出境日本已整块移除），
   其它目的地引用会明显变少。
   ========================================================================== */
const EXAMPLES = [
  {t: "带 6 岁孩子去厦门 5 天，预算 8000", expect: "plan", note: "亲子 · 出稿"},
  {t: "天安门什么时候升旗", expect: "realtime", note: "实时事实 · 走旁路，不追问行程槽位"},
  {t: "240 小时过境免签适用哪些国家", expect: "realtime", note: "来华政策 · 只给官方入口，不编数字"},
  {t: "上海有没有免费的博物馆", expect: "answer", note: "有无类事实问答 · 应回答「有 / 有哪些」+ 官网入口"},
  {t: "在中国生病了怎么办", expect: "answer", note: "就医 · 急救/看病/理赔三条"},
  {t: "Google 地图在中国能用吗", expect: "answer", note: "境外应用 · 替代方案"},
  {t: "中国要给小费吗", expect: "answer", note: "礼仪 · 生活惯例"},
  {t: "国庆去北京会不会人太多", expect: "answer", note: "节假日 · 错峰"},
  {t: "你好", expect: "guide", note: "寒暄引导 · 不再回四连问"},
  {t: "想去泰国玩", expect: "clarify", note: "故意缺槽 · 只回追问，不检索不出稿"},
];

const $ = (id) => document.getElementById(id);
const results = $("results");
const thread = $("thread");
let busy = false;
let lastMsg = "";          // 「重新生成」用的上一句
// 请求超时。真实模型单条 15–40s，给到 90s 足够；超过就放弃等待，别让用户干转圈。
const REQ_TIMEOUT_MS = 90000;
// 轮询间隔。比 SSE/NDJSON 笨，但每段都是独立小请求，任何中间层都缓冲不了它。
const POLL_MS = 400;

// 接口地址。这一层存在的理由很实在：页面可能被**拷到别的静态站点**上打开
// （编辑器预览面板就是这么干的 —— 它会把 index.html 放到自己的 127.0.0.1:49xxx 端口下），
// 那时同源的 /plan 压根不存在，页面必须自己把真服务找出来，否则就是「点了没反应」。
// 候选顺序：?api= 显式指定 > 同源 > 本机 8000（file:// 双击打开时也只有后者可用）。
let BASE = new URLSearchParams(location.search).get("api")
  || (location.protocol === "file:" ? "http://127.0.0.1:8000" : "");
const API = (p) => BASE.replace(/\/$/, "") + p;

async function resolveBase() {
  const candidates = [BASE, "", "http://127.0.0.1:8000"];
  for (const cand of candidates) {
    if (cand === BASE && candidates.indexOf(cand) !== 0) continue;  // 去重，别重复探测
    try {
      const r = await fetch(cand.replace(/\/$/, "") + "/health", {cache: "no-store"});
      if (r.ok) { await r.json(); BASE = cand; return cand; }
    } catch (e) { /* 换下一个候选 */ }
  }
  return BASE;
}

const sleep = (ms, signal) => new Promise((res, rej) => {
  const t = setTimeout(res, ms);
  // 超时/取消时要能立刻醒来，否则还得干等这一轮
  if (signal) signal.addEventListener("abort", () => { clearTimeout(t); rej(
    Object.assign(new Error("aborted"), {name: "AbortError"})); }, {once: true});
});

// 节点进度清单。顺序与 app/main.py 的 NODE_LABELS 一致（服务端为准，
// 页面这份只是渲染骨架：流式会把服务端给的 label 直接写进去）。
// realtime 是旁路：命中实时事实问询时只走 clarify → realtime → output，
// 中间五步由 markStage 标「未经过」，否则进度条会停在中间看着像卡住。
const STAGES = [
  ["clarify", "体检必填槽位"],
  ["realtime", "判定为实时事实问询"],
  ["knowledge", "判定为常识问询"],
  ["guide", "判定为寒暄/引导"],
  ["classify", "判断场景分类"],
  ["route", "选择路线与叠加层"],
  ["retrieve", "分层检索知识"],
  ["generate", "生成行程草稿"],
  ["validate", "校验预算 / 事实 / 护栏"],
  ["output", "装配最终答复"],
];

function rid() {
  return Math.random().toString(36).slice(2, 8);
}
function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(v, cur) {
  if (v === null || v === undefined || v === "") return "—";
  const n = Number(v);
  if (!isFinite(n)) return esc(v);
  return (cur || "¥") + n.toLocaleString("zh-CN", {maximumFractionDigits: 2});
}
function statusPill(s) {
  const cls = {pass:"ok", warn:"warn", repair:"bad", block:"bad"}[s] || "";
  const txt = {pass:"通过", warn:"警告", repair:"需回炉", block:"阻断"}[s] || s;
  return `<span class="pill ${cls}">${esc(txt)}</span>`;
}
/* 引用区统一的说明文案 —— 用户看到「有的能点、有的点不动」时必须有个解释。 */
const LINK_LEGEND = "带 ↗ 的可点开**官方核实入口**（官方站点，不是知识库原文）；虚线的为知识库**编辑整理**条目，没有单一官方入口可点。hover 看来源与有效期。";

/* 引用 chip。三种输入形态都要吃得下：`source_url`（Citation/KnowledgeHit 的字段名）、
   `url`（实时卡/常识卡手写映射时用的键）、以及只有 `citation_key` 的活动内引用。
   真 bug（本轮修）：行程卡的 citations 带的是 `source_url`，而这里只读 `c.url` ——
   于是**行程里所有引用 chip 都点不动**（实时卡与常识卡恰好手写了 `url`，才显得正常）。

   两种状态必须看得出区别：
   ① 有官方入口 → 强调色 + 外链箭头，文字用「来源」而不是编号（编号对用户没有意义）；
   ② 编辑整理、没有单一官方入口 → 压暗虚线，title 里明说「无官方入口可点」。
   把不可点的那一类讲明白，比让用户点一下没反应要好。 */
function chip(c) {
  const t = c.origin === "tool" ? " tool" : "";
  const url = c.url || c.source_url;
  const label = c.source || c.citation_key || "";
  const parts = [];
  if (c.source) parts.push(c.source);
  if (c.citation_key) parts.push("凭据 " + c.citation_key);
  if (c.effective_date) parts.push("生效日 " + c.effective_date);
  if (c.fresh_until) parts.push("有效期至 " + c.fresh_until);
  if (url) {
    parts.push("点击打开官方核实入口");
    return `<a class="chip${t}" href="${esc(url)}" target="_blank" rel="noreferrer" title="${esc(parts.join(" · "))}">${esc(label)}</a>`;
  }
  parts.push("本条为知识库编辑整理，无官方入口可点");
  return `<span class="chip${t} nolink" title="${esc(parts.join(" · "))}">${esc(label)}</span>`;
}

/* ---------------- 渲染 ---------------- */
function renderStats(it, v, cites) {
  const b = it.budget || {};
  const okCls = v.passed ? "ok" : "bad";
  return `<div class="stats">
    <div><b>${(it.days || []).length}</b><span>天</span></div>
    <div><b>${cites.length}</b><span>引用</span></div>
    <div><b>${money(b.total)}</b><span>分项合计</span></div>
    <div><b>${money(b.user_budget)}</b><span>你的预算</span></div>
    <div><b>${v.round}</b><span>回环轮次</span></div>
    <div><b style="color:var(--${okCls})">${v.passed ? "通过" : "未通过"}</b><span>校验</span></div>
    <div><b style="color:var(--${v.degraded ? "warn" : "ok"})">${v.degraded ? "是" : "否"}</b><span>降级</span></div>
  </div>`;
}

function renderDays(it, citeIndex) {
  const days = it.days || [];
  if (!days.length) return "";
  const idx = citeIndex || {};
  return `<h3>逐日行程</h3>` + days.map(d => `
    <div class="day">
      <div class="dhead">
        <span class="dno">第 ${esc(d.day)} 天</span>
        ${d.date ? `<span class="pill">${esc(d.date)}</span>` : ""}
        <span class="dtheme">${esc(d.theme || "")}</span>
        ${d.area ? `<span class="pill">${esc(d.area)}</span>` : ""}
      </div>
      ${(d.activities || []).map(a => `
        <div class="act">
          <div class="t mono">${esc(a.time)}</div>
          <div>
            <div class="n">${esc(a.name)} ${a.citation_key
              ? chip(Object.assign({origin: "knowledge_base"}, idx[a.citation_key] || {}, {citation_key: a.citation_key}))
              : ""}</div>
            ${a.detail ? `<div class="d">${esc(a.detail)}</div>` : ""}
            ${a.cost !== null && a.cost !== undefined ? `<div class="c">单人约 ${money(a.cost)}</div>` : ""}
          </div>
        </div>`).join("")}
    </div>`).join("");
}

function renderBudget(b) {
  if (!b) return "";
  const lines = b.lines || [];
  const max = Math.max(...lines.map(l => Number(l.amount) || 0), 1);
  const lim = b.user_budget ? b.user_budget * (1 + (b.buffer_ratio ?? 0.1)) : null;
  return `<h3>预算</h3>` + lines.map(l => `
    <div class="bline">
      <span class="nm" title="${esc(l.name)}">${esc(l.name)}</span>
      <span class="bar"><i style="width:${Math.max(2, (Number(l.amount) || 0) / max * 100)}%"></i></span>
      <span class="am">${money(l.amount)}</span>
    </div>`).join("") +
    `<div class="bsum">
      分项合计 <b>${money(b.total)}</b>
      ${b.user_budget ? ` · 你的预算 <b>${money(b.user_budget)}</b>
        · 含 ${Math.round((b.buffer_ratio ?? 0.1) * 100)}% 缓冲上限 <b>${money(lim)}</b>
        · <b style="color:var(--${b.within_budget ? "ok" : "bad"})">${b.within_budget ? "在预算内" : "超预算"}</b>` : ""}
    </div>`;
}

function renderValidation(v) {
  const checks = v.checks || [];
  const rows = checks.map(c => `<tr>
      <td class="mono">${esc(c.name)}</td>
      <td>${statusPill(c.status)}</td>
      <td><span class="pill">上限 ${esc({none:"无",warn:"警告",repair:"回炉",block:"阻断"}[c.severity] || c.severity)}</span></td>
      <td>${(c.findings || []).map(esc).join("<br>") || "—"}</td>
    </tr>`).join("");
  const un = (v.unresolved || []).length
    ? `<h3>未解决（已降级，不阻断）</h3><ul class="plain">${v.unresolved.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const ra = (v.repair_actions || []).length
    ? `<h3>回炉动作</h3><ul class="plain">${v.repair_actions.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<h3>校验报告</h3>
    <table class="v"><tr><th>检查</th><th>本次结果</th><th>配置上限</th><th>说明</th></tr>${rows}</table>
    ${un}${ra}`;
}

/* 关联问题推荐：答完给几条「接着可以问」的可点建议。
   点击由 results 上的事件委托统一处理（.sug），这里只渲染。 */
function renderNextQs(body) {
  const nq = body.next_questions || [];
  if (!nq.length) return "";
  return `<h3>接着可以问</h3>
    <div class="sugbar">${nq.map((s) =>
      `<span class="sug" data-q="${esc(s)}">${esc(s)}</span>`).join("")}</div>`;
}

function renderPlan(body, ms) {
  const it = body.itinerary || {};
  const r = body.route || {};
  const v = body.validation || {};
  const cites = body.citations || [];
  const cl = body.checklist || [];
  const sug = body.suggestions || [];
  // 活动里的 citation_key 只有编号，要拿它换出「来源 + 官方入口」就得先有一张索引。
  // 没有这张索引，逐日活动上的引用一律是不可点的编号。
  const citeIndex = {};
  cites.forEach(c => { if (c.citation_key) citeIndex[c.citation_key] = c; });
  return `<article class="card">
    <div class="chead">
      <h2>${esc(it.title)}${it.destination ? ` <span class="th">· ${esc(it.destination)}</span>` : ""}</h2>
      ${it.party ? `<span class="pill">${esc(it.party)}</span>` : ""}
      ${it.date_range ? `<span class="pill">${esc(it.date_range)}</span>` : ""}
    </div>
    ${renderStats(it, v, cites)}
    <div class="body">
      ${renderDays(it, citeIndex)}
      ${renderBudget(it.budget)}
      ${cl.length ? `<h3>行前清单</h3><ul class="plain">${cl.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${sug.length ? `<h3>建议</h3><ul class="plain">${sug.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${(it.notes || []).length ? `<h3>备注</h3><ul class="plain">${it.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${cites.length ? `<h3>引用（${cites.length} 条）</h3><div class="cites">${cites.map(chip).join("")}</div>
        <div class="legend">${LINK_LEGEND}</div>` : ""}
      ${(it.disclaimers || []).length ? `<h3>免责声明</h3><ul class="plain">${it.disclaimers.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${renderNextQs(body)}
      ${renderValidation(v)}
    </div>
    <div class="qbar">

/* AI 消息壳：先挂一个展开的「正在思考…」块，跑完折叠成「已深度思考（用时 X 秒）」。
   返回 ai-body —— markStage / diag / bumpElapsed 都在这个容器里找元素。 */
function addAiShell() {
  const d = document.createElement("div");
  d.className = "msg ai";
  d.innerHTML = AVATAR + `
    <div class="ai-body">
      <details class="think" open>
        <summary><span class="sum-ico"><i class="spin"></i></span>
          <span>正在思考…（已等 <b class="elapsed">0</b>s）</span></summary>
        <div class="think-body">
          <ol class="steps">${STAGES.map(([k, label]) =>
            `<li class="step" data-stage="${k}"><i class="dot"></i>` +
            `<span class="nm">${label}</span><span class="dt"></span></li>`).join("")}</ol>
          <div class="diag">尚未发出请求</div>
        </div>
      </details>
    </div>`;
  results.appendChild(d);
  scrollBottom(true);
  return d.querySelector(".ai-body");
}

function bumpElapsed(holder, sec) {
  const el = holder.querySelector(".elapsed");
  if (el) el.textContent = sec.toFixed(0);
}

function diag(holder, text, warn) {
  const el = holder.querySelector(".diag");
  if (!el) return;
  el.innerHTML = text;   // 诊断行里会带 <b>/<span class=mono>，用 innerHTML 才能显示
  el.classList.toggle("warn", !!warn);
}

// 跑完：把「正在思考」那行换成「已深度思考（用时 X 秒）」并收起，
// 再补上操作栏（复制 / 重新生成 / 反馈）。
function finishThink(holder, ms) {
  const box = holder.querySelector(".think");
  if (!box) return;
  const steps = holder.querySelectorAll(".step.done").length;
  const sum = box.querySelector("summary");
  sum.innerHTML = `<span class="sum-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <span>已深度思考（用时 ${(ms / 1000).toFixed(1)} 秒）</span>`;
  // 诊断行收尾：轮询时的「已完成 N 步」是过程态，跑完还留着会让人以为没结束。
  const dg = holder.querySelector(".diag");
  if (dg) {
    dg.classList.remove("warn");
    dg.innerHTML = `链路完成 · 走过 <b>${steps}</b> 个节点 · 共 ${(ms / 1000).toFixed(1)}s`;
  }
  box.open = false;
}

const ACT_COPY = `<button data-act="copy" title="复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>`;
const ACT_RETRY = `<button data-act="retry" title="重新生成"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>`;
const ACT_UP = `<button data-act="up" title="有帮助"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 22V11l5-9a2.5 2.5 0 0 1 2.4 3.2L13.5 10H20a2 2 0 0 1 2 2.4l-1.6 8A2 2 0 0 1 18.4 22H7Z"/><path d="M7 11H3v11h4"/></svg></button>`;
const ACT_DOWN = `<button data-act="down" title="没帮助"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2v11l-5 9a2.5 2.5 0 0 1-2.4-3.2L10.5 14H4a2 2 0 0 1-2-2.4l1.6-8A2 2 0 0 1 5.6 2H17Z"/><path d="M17 13h4V2h-4"/></svg></button>`;

function addActions(holder) {
  const d = document.createElement("div");
  d.className = "ai-actions";
  d.innerHTML = ACT_COPY + ACT_RETRY + ACT_UP + ACT_DOWN;
  holder.appendChild(d);

// 服务端每跑完一个节点推来的事件 → 进度条前进一格。
function markStage(holder, ev) {
  const all = [...holder.querySelectorAll(".step")];
  const idx = all.findIndex((el) => el.dataset.stage === ev.stage);
  if (idx > 0) {
    // 跳过的步骤明确标出来。实时事实问询只走 clarify → realtime → output，
    // 中间五步永远等不到事件 —— 不标记的话，进度条会停在那一步看着像卡住。
    all.slice(0, idx).forEach((el) => {
      if (!el.classList.contains("done")) el.classList.add("skip");
    });
  }
  const li = all[idx];
  if (li) {
    const again = li.classList.contains("done") ? "重跑 · " : "";
    if (ev.label) li.querySelector(".nm").textContent = ev.label;
    li.querySelector(".dt").textContent =
      `${again}${ev.detail || ""} · ${(ev.ms / 1000).toFixed(1)}s`;
    li.classList.remove("skip");
    li.classList.add("done");
  }
  all.forEach((el) => el.classList.remove("run"));
  const next = all.find((el) => !el.classList.contains("done") && !el.classList.contains("skip"));
  if (next) next.classList.add("run");
  bumpElapsed(holder, ev.ms / 1000);
}

async function fetchPlanOnce(payload, ctrl) {
  const resp = await fetch(API("/plan"), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload),
    signal: ctrl.signal,
  });
  const body = await resp.json().catch(() => null);
  if (!resp.ok) {
    const detail = body && body.detail ? JSON.stringify(body.detail) : `HTTP ${resp.status}`;
    throw Object.assign(new Error(detail), {status: resp.status});
  }
  return {body};
}

// 跑链路：起步一步（拿 task_id）+ 短轮询拿进度。
//
// 为什么不用 NDJSON 流（即使服务端仍然提供 /plan/stream）：
//   流会被「不知道响应该逐段转发」的中间层缓冲到结束才吐 —— 编辑器预览面板、
//   公司代理都干得出来。那时事件全在最后一刻到达，用户看到的还是「一直转圈」。
//   短轮询每段都是独立小请求，最笨但最稳。
// 老服务没有 /plan/start（404）时退回一次性接口，功能不降级，只是没有进度条。
async function fetchPlan(payload, holder, ctrl) {
  const headers = {"Content-Type": "application/json"};
  // 这一句是整条链的第一份证据：出现说明 JS 在跑且请求已出网。
  diag(holder, `已发出请求（${esc(BASE === "" ? "同源" : BASE)}），等待服务端起步…`);
  const resp = await fetch(API("/plan/start"), {
    method: "POST", headers, body: JSON.stringify(payload), signal: ctrl.signal,
  });
  if (resp.status === 404) {
    diag(holder, "当前服务没有 /plan/start（老进程），已退回一次性接口 —— 没有进度条", true);
    return await fetchPlanOnce(payload, ctrl);
  }
  if (!resp.ok) {
    const detail = await resp.text().catch(() => "");
    throw Object.assign(new Error(`HTTP ${resp.status} ${detail.slice(0, 200)}`),
      {status: resp.status});
  }
  const {task_id} = await resp.json();
  diag(holder, `已开后台任务 <span class="mono">${esc(task_id.slice(0, 8))}</span>，开始轮询`);

  let seen = 0;
  for (;;) {
    await sleep(POLL_MS, ctrl.signal);
    const pr = await fetch(API(`/plan/progress/${task_id}`), {signal: ctrl.signal});
    if (!pr.ok) {
      throw Object.assign(new Error(`进度查询失败 HTTP ${pr.status}`), {status: pr.status});
    }
    const st = await pr.json();
    for (const ev of st.stages.slice(seen)) markStage(holder, ev);
    seen = st.stages.length;
    // 计时用服务端返回的耗时，不用 performance.now()：
    // 标签页不可见时本地定时器会被节流到分钟级，那是「一直显示 0s」的根因。
    bumpElapsed(holder, st.ms / 1000);
    diag(holder, `轮询中 · 已完成 <b>${seen}</b> 步 · 服务端累计 ${(st.ms / 1000).toFixed(1)}s`);
    if (st.done) {
      if (st.error) throw new Error(st.error);
      if (!st.response) throw new Error("任务已完成但没有返回结果体");
      return {body: st.response, ms: st.ms};
    }
  }
}

/* ---------------- 行程信息卡 ---------------- */
// 表单 → 服务端 slot_overrides 的字段表。`key` 是服务端认的键（见 slots_from_form）。
const FORM_FIELDS = [
  ["f-dest", "destination", "text"],
  ["f-days", "days", "number"],
  ["f-budget", "budget", "number"],
  ["f-nationality", "nationality", "text"],
  ["f-adults", "adults", "number"],
  ["f-children", "children", "number"],
  ["f-childage", "child_age", "number"],
  ["f-elders", "elders", "number"],
];

function collectForm() {
  const out = {};
  for (const [id, key, kind] of FORM_FIELDS) {
    const el = $(id);
    if (!el) continue;
    const v = String(el.value || "").trim();
    if (!v) continue;                       // 留空 = 没填，不发
    if (kind === "number") {
      const n = Number(v);
      if (!isFinite(n) || n < 0) continue;  // 非法输入当没填，不让服务端去猜
      out[key] = n;
    } else {
      out[key] = v;
    }
  }
  return out;
}

// 服务端认出来的东西回填表单（GET /session 里的 slots）。
// 只填**当前为空**的格子：用户在表单里手改过的值不能被一次响应悄悄覆盖回去。
function syncFormFromSlots(slots) {
  if (!slots) return;
  const put = (id, val) => {
    const el = $(id);
    if (el && !String(el.value || "").trim() && val !== undefined && val !== null && val !== "")
      el.value = val;
  };
  put("f-dest", slots.destination_surface || slots.destination);
  put("f-days", slots.days);
  put("f-budget", slots.budget);
  put("f-nationality", slots.nationality_surface || slots.nationality);
  if (slots.party_size && !String($("f-adults").value || "").trim()
      && !String($("f-children").value || "").trim()
      && !String($("f-elders").value || "").trim()) {
    // 会话里只有合计人数时，按已知构成还原：儿童/长者各取 1，其余算成人。
    // 这是**推导值**，所以只在三格全空时写 —— 用户手填过的优先。
    const kids = slots.has_children ? 1 : 0;
    const elders = slots.has_elder ? 1 : 0;
    const adults = Math.max(0, Number(slots.party_size) - kids - elders);
    $("f-children").value = kids ? String(kids) : "";
    $("f-elders").value = elders ? String(elders) : "";
    $("f-adults").value = String(adults);
  }
  if (slots.child_age) put("f-childage", slots.child_age);
}

/* 追问卡里的快捷补充：把缺的那几项就地摆出来。
   用 data-form-field 指向上面的表单同一格子 —— 单一数据源，不存在两份值打架。 */
const MISSING_FIELDS = {
  destination: [["f-dest", "目的地", "text", "厦门"]],
  destination_country: [["f-dest", "目的地", "text", "中国"]],
  date_range: [["f-days", "玩几天", "number", "5"]],
  budget: [["f-budget", "预算（元）", "number", "8000"]],
  party: [["f-adults", "成人", "number", "1"],
          ["f-children", "儿童", "number", "0"],
          ["f-elders", "长者（60+）", "number", "0"]],
};

function quickFillHtml(missing) {
  const rows = [];
  for (const key of missing || []) {
    for (const [id, label, kind, ph] of (MISSING_FIELDS[key] || [])) {
      rows.push(`<label class="ff">${esc(label)}
        <input type="${kind}" data-form-field="${id}" placeholder="${esc(ph)}"
               ${kind === "number" ? 'min="0"' : ""}></label>`);
    }
  }
  if (!rows.length) return "";
  return `<div class="qf">
      <div class="qfh">快捷补充：填完直接按下面这个按钮重发本句 —— 这几项就不再靠识别，
        按你填的算。不想逐项填，就点右边那个，交给系统按常规安排。</div>
      <div class="fgrid">${rows.join("")}</div>
      <div class="qfbtns">
        <button id="qf-send">按填写的信息重发本句</button>
        <button id="qf-delegate" class="ghost" data-q="都听你的，你帮我定"
          title="天数 / 预算 / 人数交给系统按常规安排（5 天 · 约 5000 元 · 2 人），不再逐项追问">都听你的，你帮我定</button>
      </div>
    </div>`;
}

// 快捷补充里的输入 → 写回上面的表单格子（只写有值的）
function applyQuickFields(scope) {
  scope.querySelectorAll("[data-form-field]").forEach((el) => {
    const target = $(el.dataset.formField);
    const v = String(el.value || "").trim();
    if (target && v) target.value = v;
  });
}

/* ---------------- 发送 ---------------- */
async function send() {
  const msg = $("msg").value.trim();
  if (!msg) { $("msg").focus(); return; }
  if (busy) return;
  busy = true;
  lastMsg = msg;
  setSendEnabled(false);
  $("msg").value = "";
  autoGrow();
  // 等地址解析完成：页面可能是被拷到别的静态端口打开的，那时得先找到真服务。
  await baseReady;

  addUser(msg);
  const lang = $("lang").value;
  const sid = $("sid").value.trim() || rid();
  $("sid").value = sid;
  const payload = {session_id: sid, message: msg};
  if (lang) payload.output_language = lang;
  // 行程信息卡：填了就一起发。服务端把它折成标准槽位（app/slots.py::slots_from_form），
  // 优先级是 本句 > 表单 > 会话历史 —— 所以带着它永远不会盖掉你这句话里自己说清的东西。
  const fo = collectForm();
  if (Object.keys(fo).length) payload.slot_overrides = fo;

  const holder = addAiShell();
  const firstStep = holder.querySelector(".step");
  if (firstStep) firstStep.classList.add("run");

  // 超时兜底：请求挂住时至少要有「已放弃等待」这句，而不是无限转圈。
  const t0 = performance.now();
  const ctrl = new AbortController();
  const kill = setTimeout(() => ctrl.abort(), REQ_TIMEOUT_MS);
  // 本地计时是兜底而非主力：标签页不可见时 setInterval 会被节流到分钟级，
  // 只靠它会一直显示 0s。真正的「在动」由服务端每一步的结果驱动。
  const tick = setInterval(() => bumpElapsed(holder, (performance.now() - t0) / 1000), 250);
  // 6 秒还没点亮第一步，基本就是「页面这一侧」的问题 —— 服务端 clarify 通常 <1s。
  const watch = setTimeout(() => {
    if (!holder.querySelector(".step.done")) {
      diag(holder,
        "超过 6s 还没有点亮任何一步。服务端单步通常是亚秒到几秒，所以原因多半在页面这一侧："
        + "① 拿到了旧 HTML → Ctrl+F5 硬刷新；"
        + "② 预览面板那一层有缓存或限制 → 直接在资源管理器里双击 "
        + "<span class=\"mono\">web/index.html</span> 用系统浏览器打开（接口已放开 CORS，file:// 也能跑）。",
        true);
    }
  }, 6000);

  try {
    const out = await fetchPlan(payload, holder, ctrl);
    const ms = out.ms || Math.round(performance.now() - t0);
    const body = out.body;
    const html =
      body.type === "clarify" ? renderClarify(body, ms) :
      body.type === "realtime" ? renderRealtime(body, ms) :
      body.type === "answer" ? renderAnswer(body, ms) :
      body.type === "guide" ? renderGuide(body, ms) :
      body.type === "degraded" ? renderDegraded(body, ms) :
      renderPlan(body, ms);
    const card = document.createElement("div");
    card.innerHTML = html;
    // think 块要留着（跑完折叠成「已深度思考」），所以先摘出来再重建内容。
    const think = holder.querySelector(".think");
    finishThink(holder, ms);
    holder.innerHTML = "";
    if (think) holder.appendChild(think);
    holder.appendChild(card.firstElementChild);
    addActions(holder);
    noteTurn(sid, msg, body.type);
    scrollBottom(true);
  } catch (e) {
    const aborted = e && e.name === "AbortError";
    const denied = e && e.status ? `请求被拒（HTTP ${e.status}）` : "";
    const think = holder.querySelector(".think");
    holder.innerHTML = "";
    if (think) holder.appendChild(think);
    const err = document.createElement("div");
    err.innerHTML = `<div class="err">`
      + (aborted
        ? `<b>超过 ${REQ_TIMEOUT_MS / 1000} 秒未返回，已放弃等待</b><br>
           展开上面的「已深度思考」看进度条停在哪一步，卡的就是那一步（通常是 generate 在等模型）。<br>
           一条链路最多调 3 次模型（分类 + 生成 + 回环重生成），单次上限 60 秒，
           所以最坏情况要 3 分钟 —— 页面等不了那么久，先放弃了。<br>
           可以直接点「重新生成」再发一次（第二次通常快很多，命中同样的检索结果）；
           也可以在系统浏览器直接打开 <span class="mono">http://127.0.0.1:8000/</span>
           排除预览面板的因素。`
        : denied
          ? `<b>${denied}</b><br>${esc(e.message)}`
          : `<b>链路返回错误</b><br>${esc(e.message)}<br>
             确认 <span class="mono">uvicorn app.main:app --port 8000</span> 还在跑。`)
      + `</div>`;
    holder.appendChild(err);
    finishThink(holder, Math.round(performance.now() - t0));
  } finally {
    clearTimeout(watch);
    clearTimeout(kill);
    clearInterval(tick);
    busy = false;
    setSendEnabled(true);
    // 每轮结束刷一次记忆面板：服务端记了什么，页面上就要看得见。
    refreshMemory();
  }
}

function setSendEnabled(on) {
  const b = $("send");
  b.disabled = !on;
}

// 输入框随内容长高，最多 190px（CSS 里 clamp），超出内部滚动。
function autoGrow() {
  const el = $("msg");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 190) + "px";
}

/* ==========================================================================
   会话列表：本地存标题与轮次，切换会话只是换 session_id ——
   服务端按 sid 存记忆，所以切回去继续追问照样能承接上文。
   （正文不重放：服务端只留要点，不假装能还原全文。）
   ========================================================================== */
const LS_KEY = "trippal.sessions";
let sessions = {};
try { sessions = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { sessions = {}; }
function saveSessions() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(sessions)); } catch (e) { /* 无痕模式，忽略 */ }
}
const TYPE_NAME = {
  clarify: "追问槽位", realtime: "实时事实", answer: "常识问询",
  guide: "寒暄引导", plan: "行程草稿", degraded: "降级",
};

function renderSessions() {
  const box = $("slist");
  const cur = $("sid").value.trim();
  const ids = Object.keys(sessions).sort((a, b) => (sessions[b].ts || 0) - (sessions[a].ts || 0));
  box.innerHTML = `<div class="sgroup">最近对话</div>` + ids.map(id => {
    const s = sessions[id];
    return `<div class="sitem ${id === cur ? "on" : ""}" data-sid="${esc(id)}">
        <span class="t">${esc(s.title || "新的对话")}</span>
        ${s.turns ? `<span class="mono" style="font-size:11px;opacity:.7">${s.turns}</span>` : ""}
        <button class="del" data-del="${esc(id)}" title="删除这段对话">×</button>
      </div>`;
  }).join("");
}

function noteTurn(sid, text, type) {
  const s = sessions[sid] || {title: text.slice(0, 22), turns: 0, ts: Date.now()};
  s.turns = (s.turns || 0) + 1;
  s.ts = Date.now();
  s.last = TYPE_NAME[type] || type || "";
  sessions[sid] = s;
  saveSessions();
  renderSessions();
  $("topictitle").textContent = s.title;
}

function newSession() {
  const id = rid();
  $("sid").value = id;
  $("sidshow").textContent = id;
  $("memory").hidden = true;
  $("topictitle").textContent = "新的对话";
  results.innerHTML = `<div class="hero" id="hero">
      <h1>来华旅行，问我</h1>
      <p class="lead">行程规划 · 签证与入境 · 支付与网络 · 交通 · 吃喝 · 就医 —— 中英日韩都能问</p>
      <div class="ex" id="exbox"></div>
    </div>`;
  renderExamples();
  // 信息卡跟着会话走：换了会话就该是空的，否则会把上一段的目的地/人数带过去
  for (const [fid] of FORM_FIELDS) { const el = $(fid); if (el) el.value = ""; }
  renderSessions();
  $("msg").focus();
}

function renderExamples() {
  const exBox = $("exbox");
  if (!exBox) return;
  EXAMPLES.forEach(e => {
    const b = document.createElement("span");
    b.className = "chip-ex"
      + (e.expect === "clarify" ? " ex-clarify" : "")
      + (e.expect === "realtime" ? " ex-realtime" : "")
      + (e.expect === "answer" ? " ex-answer" : "")
      + (e.expect === "guide" ? " ex-guide" : "");
    b.textContent = e.t;
    b.title = e.note + "（点击即直接发送）";
    // 点示例要直接跑链路 —— 只填进输入框不发送，会被当成「点了没反应 / 链路不通」
    b.onclick = () => { $("msg").value = e.t; autoGrow(); send(); };
    exBox.appendChild(b);
  });
}

/* 会话记忆面板：读服务端 GET /session/{sid}，把「这次会话记住了什么」摆出来。
   追问句（「那要预约吗」「开放时间呢」）之所以能答到点上，靠的就是它列出的
   上一轮主体与实词 —— 所以这一栏不只是展示，它是记忆功能的可见证据。 */
async function refreshMemory() {
  const box = $("memory");
  const sid = $("sid").value.trim();
  if (!box || !sid) return;
  try {
    await baseReady;
    const r = await fetch(API(`/session/${encodeURIComponent(sid)}`));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const s = await r.json();
    syncFormFromSlots(s.slots);   // 服务端认出来的东西回填信息卡空白格
    const recent = s.recent || [];
    if (!recent.length) { box.hidden = true; return; }
    const subj = s.last_fact_subject
      ? ` · 上一轮主体 <span class="mem-sub">${esc(s.last_fact_subject)}</span>` : "";
    box.hidden = false;
    box.innerHTML =
      `<div class="mem-h">会话记忆：已记住 <b>${recent.length}</b> 轮${subj}</div>` +
      `<ol>${recent.map((t) => `<li>${esc(t.message)}` +
        `<span class="mem-tag">${esc(TYPE_NAME[t.type] || t.type)}</span>` +
        (t.subject ? `<span class="mem-tag">${esc(t.subject)}</span>` : "") +
        `</li>`).join("")}</ol>`;
  } catch (e) {
    box.hidden = true;   // 记忆面板是锦上添花，取不到就收起来，不影响主流程
  }
}

/* ---------------- 事件绑定 ---------------- */
$("send").addEventListener("click", send);
$("msg").addEventListener("input", autoGrow);
$("msg").addEventListener("keydown", (e) => {
  // Enter 发送、Shift+Enter 换行 —— 与 DeepSeek / ChatGPT 一致
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("newsess").addEventListener("click", newSession);
$("clear").addEventListener("click", () => {
  const sid = $("sid").value.trim();
  if (sid && sessions[sid]) { delete sessions[sid]; saveSessions(); }
  newSession();
});
$("formclear").addEventListener("click", () => {
  for (const [id] of FORM_FIELDS) { const el = $(id); if (el) el.value = ""; }
});
$("formtoggle").addEventListener("click", () => {
  const card = $("formcard");
  const open = card.hidden;
  card.hidden = !open;
  $("formtoggle").classList.toggle("on", open);
});
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("trippal.theme", dark ? "light" : "dark"); } catch (e) {}
});
$("sbtoggle").addEventListener("click", () => { $("sidebar").classList.toggle("collapsed"); });
$("slist").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    delete sessions[del.dataset.del];
    saveSessions();
    if ($("sid").value === del.dataset.del) newSession(); else renderSessions();
    return;
  }
  const it = e.target.closest("[data-sid]");
  if (!it) return;
  const sid = it.dataset.sid;
  if (sid === $("sid").value) { $("sidebar").classList.add("collapsed"); return; }
  // 切换会话：服务端仍按 sid 记着上下文，所以这里只换 id + 清屏，
  // 不假装能重放旧正文（服务端只留要点）。
  $("sid").value = sid;
  $("sidshow").textContent = sid;
  results.innerHTML = "";
  $("topictitle").textContent = (sessions[sid] && sessions[sid].title) || "新的对话";
  for (const [fid] of FORM_FIELDS) { const el = $(fid); if (el) el.value = ""; }
  renderSessions();
  $("memory").hidden = true;
  refreshMemory();
  $("sidebar").classList.add("collapsed");
});

// 卡片里的可点元素：事件委托（卡片是后插入的，直接绑会漏）
results.addEventListener("click", (e) => {
  // 追问卡里的「按填写的信息重发本句」：把快捷补充写回表单，原话不变再发一次。
  const qf = e.target.closest("#qf-send");
  if (qf) {
    if (busy) return;
    applyQuickFields(qf.closest(".card") || document);
    $("msg").value = lastMsg;
    send();
    return;
  }
  // 「都听你的，你帮我定」：把决定权交给系统的**一键出口**。
  const qfD = e.target.closest("#qf-delegate");
  if (qfD) {
    if (busy) return;
    applyQuickFields(qfD.closest(".card") || document);
    $("msg").value = qfD.dataset.q || "都听你的，你帮我定";
    send();
    return;
  }
  // 操作栏：复制 / 重新生成 / 反馈
  const act = e.target.closest("[data-act]");
  if (act) {
    const body = act.closest(".ai-body");
    const kind = act.dataset.act;
    if (kind === "copy") {
      const src = body.querySelector(".card");
      const txt = src ? src.innerText : body.innerText;
      navigator.clipboard?.writeText(txt).then(() => {
        act.classList.add("on");
        setTimeout(() => act.classList.remove("on"), 1200);
      }).catch(() => {});
    } else if (kind === "retry") {
      if (!busy && lastMsg) { $("msg").value = lastMsg; autoGrow(); send(); }
    } else if (kind === "up" || kind === "down") {
      const other = body.querySelector(`[data-act="${kind === "up" ? "down" : "up"}"]`);
      if (other) other.classList.remove("on");
      act.classList.toggle("on");
    }
    return;
  }
  // 「接着可以问」/「试着这样问」：点击即发
  const s = e.target.closest(".sug");
  if (!s || busy) return;
  $("msg").value = s.dataset.q || "";
  autoGrow();
  send();
});

/* ---------------- 启动 ---------------- */
try {
  const th = localStorage.getItem("trippal.theme");
  if (th === "dark" || th === "light") document.documentElement.dataset.theme = th;
} catch (e) {}
$("sid").value = rid();
$("sidshow").textContent = $("sid").value;
renderExamples();
renderSessions();
autoGrow();
if (window.innerWidth <= 880) $("sidebar").classList.add("collapsed");

// 页面一加载就把服务地址定下来（可能要试探多个候选），后续的发送请求都 await 它。
const baseReady = resolveBase().then(base => {
  fetch(API("/health")).then(r => r.json()).then(h => {
    $("health").innerHTML =
      `模型 <b>${esc(h.llm_provider)}</b> · 种子 <b>${esc(h.chunks)}</b> 条<br>` +
      `<span class="mono">${esc(h.vector_backend)} · ${esc(h.routes_version)}</span>`;
  }).catch(() => {
    $("health").textContent = "服务状态读取失败（检查 uvicorn 是否在跑）";
  });
  return base;
});
</script>
</body>
</html>

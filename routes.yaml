  "四川": {type: region, country: "中国", aliases: ["Sichuan", "쓰촨"]}
  # 大陆主力城市（入境游最常被问到的目的地）。旧词表只有北京/厦门/杭州/泉州/福州/
  # 成都/青岛/大理/丽江 + 云贵川三个省，于是「重庆 4 天，预算 3000，两个人」被反问
  # 「想去的城市或国家是哪里」—— 用户说了城市，系统却说没有。
  # 地标别名一律挂到所在城市（同北京「天安门」的做法），让「兵马俑」「外滩」也能抽出地点。
  "上海": {type: city, country: "中国",
           aliases: ["Shanghai", "상하이", "シャンハイ", "外滩", "豫园", "陆家嘴", "The Bund", "Yu Garden"]}

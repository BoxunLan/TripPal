# 槽位别名：从用户原话里抽取槽位的确定性规则（clarify 节点用，不依赖 LLM）
# 注意：天数 / 预算 / 人数这三类数字槽位一律走这里，不让 LLM 抽 —— 它们要进预算算术。
# 中文与英文都要有：英文请求走英文规则，否则会误判成「缺槽」而只追问不检索。
slot_extraction:
  date_range:
    - "(\\d{4})\\s*[-/年]\\s*(\\d{1,2})\\s*[-/月]\\s*(\\d{1,2})"
    # 中文数词（三/两/十五/二十三）与阿拉伯数字等价。
    # 「厦门三天」「厦门五日家庭游」这类写法在中文口语里远多于「3 天」，
    # 旧规则只写 (\\d+) → 中文数词整体抽不到 → clarify 反问用户刚说过的天数。
    # 复合数词靠 [一两二三四五六七八九十]+ 贪婪匹配，由 slots._cn_num 解析（十五→15、二十三→23）。
    - "(?<!第)(?<!第 )(\\d+|[一两二三四五六七八九十]+)\\s*天"
    - "(?<!第)(?<!第 )(\\d+|[一两二三四五六七八九十]+)\\s*晚"
    # 周 / 星期 / 礼拜：「厦门玩一周」是最常见的说法；一周=7 天（slots._is_week_pattern 乘 7）。
    # 负向排除「周末」（无时长含义，且前面通常没有数词）与「一周年 / 两周岁」（属年龄/纪念，不是行程）。
    - "([一两二三四五六七八九十\\d]+)\\s*个?\\s*(?:周|週|星期|礼拜)(?!末|年|岁|庆)"
    # 英文：5 days / 4 nights / for 5 days
    - "(?:for\\s+)?(\\d+|one|two|three|four|five|six|seven|eight)\\s*days?\\b"
    - "(\\d+|one|two|three|four|five|six|seven|eight)\\s*night?s?\\b"
    # 日文：5日間 / 4泊（「泊」按晚算，+1 天）。负向排除「1日あたり」（那是人均每日预算）
    - "(\\d+|[一两二三四五六七八九十]+)\\s*泊"
    - "(?<!第)(?<!第 )(\\d+|[一两二三四五六七八九十]+)\\s*日間"
    # 「N 日」= N 天。前面的负向断言排除日期写法（「12月25日」「2026年3月8日」里的 25日/8日 是日期不是时长），
    # 否则中文数词一放开，「十二月二十五日出发」会被读成 25 天行程。
    # 「N 日目」是「第 N 天」（行程锚点），不是「N 天」—— 必须排除，否则日文用户说
    # 「3日目はきつい」会被当成「改成 3 天」，把 5 天行程直接砍成 3 天（真 bug 2026-10-06 P12）。
    # 「の」也进负向断言：日语「来月の20日」「3月の20日」里的「20日」是**某月 20 号**，
    # 不是 20 天。漏了它，「来月の20日」会被读成 20 天行程（错值比缺值更危险，2026-10-08 实测）。
    - "(?<!第 )(?<![\\d月年第の])(\\d+|[一两二三四五六七八九十]+)\\s*日(?!\\s*あたり|目)"
    # 韩文：5일 / 4박。负向排除「1일 500원」（那是每日预算，不是行程天数）
    # 与「N일차」=「第 N 天」（同样是行程锚点，见上）。
    - "(\\d+|[一两二三四五六七八九十]+)\\s*박"
    - "(?<!제)(\\d+|[一两二三四五六七八九十]+)\\s*일(?!\\s*(?:\\d|예산|당|에)|차)"
  budget:
    # 量级后缀（万/萬/千）必须进可选单位类，否则「预算 2万」只吃到数字 2，
    # 后面由 slots._budget_scale 按匹配文本换算。少了这一步 2 万会被读成 2 元。
    # 中文数词同样要认：「预算两万」「预算五千」「预算三百」是很常见的口语写法，只认阿拉伯数字会漏。
    # 捕获组里必须**包含量级字符**（百千萬万）：复合量级要整体解析 —— 只抓「三」再由
    # 后缀乘一次，会把「三百万」读成 300，静默把超预算判定反过来（slots._cn_amount 负责解析）。
    - "每天\\s*(?:人均)?\\s*(\\d+(?:\\.\\d+)?|[一两二三四五六七八九十百千萬万佰亿零〇]+)\\s*(?:元|块|万|萬|千|百|佰)?"
    - "每日\\s*(?:人均)?\\s*(\\d+(?:\\.\\d+)?|[一两二三四五六七八九十百千萬万佰亿零〇]+)\\s*(?:元|块|万|萬|千|百|佰)?"
    - "人均\\s*(\\d+(?:\\.\\d+)?|[一两二三四五六七八九十百千萬万佰亿零〇]+)\\s*(?:元|块|万|萬|千|百|佰)?"
    # 「预算 8000 / 预算下限 8000 / 预算约 8000」都是总预算，中间的量级或修饰词不能吃掉数字。
    - "预算\\s*(?:下限|上限|封顶|约|是|为|大概|大约)?\\s*[¥￥$]?\\s*(\\d+(?:\\.\\d+)?|[一两二三四五六七八九十百千萬万佰亿零〇]+)\\s*(?:元|块|万|萬|千|百|佰)?"
    # 「N元以内/以下」的量级在数字与后缀之间（三百以内 / 2万元以内），单位必须进捕获组，
    # 否则「三百以内」只剩下「三」、量级无处可寻。
    - "((?:\\d+(?:\\.\\d+)?|[一两二三四五六七八九十百千萬万佰亿零〇]+)\\s*(?:元|块|万|萬|千|百|佰))\\s*(?:以内|以下|左右|封顶|上限)"
    # 英文：budget 8000 / budget around 10000 RMB / 8000 yuan / 300 per day / 150 per person
    # （`around/about/roughly` 这类夹在中间的说法要放行；大小写由 slots._extract_budget 的
    #   IGNORECASE 兜住，所以这里不用再写 YUAN|RMB 大写变体。）
    - "budget\\s*(?:of|is|:)?\\s*(?:around|about|roughly|approximately|approx\\.?|~)?\\s*[¥$€]?\\s*(\\d+(?:\\.\\d+)?)"
    - "(\\d+(?:\\.\\d+)?)\\s*(?:yuan|rmb|cny|usd|dollars?)\\b"
    - "(\\d+(?:\\.\\d+)?)\\s*(?:per\\s+day|a\\s+day|daily|/\\s*day)\\b"
    - "(\\d+(?:\\.\\d+)?)\\s*(?:per\\s+person|pp)\\b"
    # 日文 / 韩文。注意口径：本项目的预算一律按人民币理解，
    # 「5000円 / 5000원」只取数字、不换算汇率 —— 真要换算得先有汇率源。
    - "予算\\s*(?:は|が|:)?\\s*[¥￥]?\\s*([\\d一两二三四五六七八九十百千萬万佰亿零〇]+)"
    # 语序：日 / 韩是**谓语后置**，「预算」这个词落在数字之后（「3万元の予算」）。上面那些
    # 规则全部假设提示词在前，整条落空 → 用户明明报了预算，系统一路「还差预算」（真 bug
    # 2026-10-08 用户实测：日语会话卡在追问环节）。这里补「金额 + の + 预算」的后置形态。
    - "([\\d一两二三四五六七八九十百千萬万佰亿零〇]+\\s*(?:元|块|円|万|萬|千|百|佰))\\s*の?\\s*(?:予算|預算|预算)"
    - "([\\d一两二三四五六七八九十百千萬万佰亿零〇]+(?:\\.\\d+)?)\\s*円"
    - "1日\\s*(?:あたり)?\\s*(\\d+(?:\\.\\d+)?)"
    - "예산\\s*(?:은|는|이|:)?\\s*[₩￦]?\\s*([\\d一两二三四五六七八九十百千萬万佰亿零〇]+)"
    - "([\\d一两二三四五六七八九十百千萬万佰亿零〇]+(?:\\.\\d+)?)\\s*원"
    - "1일\\s*(?:당|에|씩)?\\s*(\\d+(?:\\.\\d+)?)"
  party:
    # ⚠️ 这张短语表已经**降级为兜底**：`slots._extract_party` 先用组合语法扫
    # （数词 × 量词 × 身份词，见 slots._PARTY_COUNT_RES），扫不到才走到这里。
    # 原因写在 app/slots.py：`(\d+)\s*(?:个|名)?\s*人` 这类整串枚举要求三样东西
    # 严丝合缝相邻，「一个成年人」「1位成人」换个量词/修饰词就整条落空。
    # 在这里**继续加短语**治不好那类问题 —— 下面这些现在只负责语法没覆盖语种的措辞
    # （日文的「夫婦 / カップル」、韩文的「부부 / 커플」这类没有组合关系的固定说法）。
    # 中文数词必须一起认：「我们三个人」里根本没有阿拉伯数字，而这恰恰是最口语的说法。
    - "([一两二三四五六七八九十\\d]+)\\s*(?:个|名)?\\s*人"
    - "([一两二三四五六七八九十\\d]+)\\s*个大人"
    - "([一两二三四五六七八九十\\d]+)\\s*名成人"
    # 「三口之家 / 五口人」也是人数
    - "([一两二三四五六七八九十\\d]+)\\s*口(?:人|之家)"
    - "(\\d+)\\s*명"
    # 「情侣 / 夫妻 / 夫妇」是最常见的双人措辞；漏掉它 party 槽位就落不下去，
    # 明明信息给全了（目的地+天数+预算+两人）也会被 clarify 拦下。
    - "(两人|二人|双人|俩|两个|情侣|恋人|夫妻|夫妇|两口子|蜜月)"
    - "(独行|自己一个|一个人|单个|单人|独自)"
    - "(一家(?:人)?)"
    # 「全家 / 家庭游 / 亲子游」同样是 2 大 1 小的家庭出行；漏掉它「全家去厦门 5 天」会被反问人数。
    # 只列带「游/旅行」的「家庭」，不列裸「家庭」——「家庭房」是房型，不是同行人。
    - "(全家(?:人)?|家庭游|家庭旅行|亲子游)"
    - "(带(?:着)?\\s*(?:\\d+\\s*岁)?\\s*(?:孩子|小孩|娃|宝宝|儿童))"
    - "(亲子|带娃)"
    # 英文：two adults / 3 people / couple / solo / family with kids
    - "(\\d+|one|two|three|four|five|six)\\s*(?:people|persons?|adults?|pax|travell?ers?)\\b"
    - "(couple|solo|alone|by myself|honeymoon)"
    - "(family|with\\s+(?:a\\s+|an\\s+)?(?:kid|kids|child|children|toddler|baby))"
    # 日文 / 韩文：夫妻与独行必须显式列，否则会掉进「未识别→2 大 1 小」的兜底
    - "(夫婦|カップル|恋人|新婚|一人|ひとり|家族|子供連れ|子ども連れ)"
    - "(부부|커플|신혼|혼자|가족|아이|어린이)"

# 提示词路径（相对仓库根）
prompts:
  base: prompts/base.md
  safety_overlay: prompts/safety.md
  # 常识作答（intents.knowledge_question 的 answer 旁路）。与 base 分开是因为它
  # 面向完全不同的任务：那里是「按场景写行程」，这里是「只答一件事、不写攻略」。
  answer: prompts/answer.md
  # 寒暄引导（intents.social 的 guide 旁路）：面向「一句话把人引到旅游话题」这件任务。
  guide: prompts/guide.md
  dir: prompts

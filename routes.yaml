  "旧金山": {type: city, country: "美国", aliases: ["San Francisco", "샌프란시스코", "サンフランシスコ"]}
  "洛杉矶": {type: city, country: "美国", aliases: ["Los Angeles", "로스앤젤레스", "ロサンゼルス"]}

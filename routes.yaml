    # 「生病」必须进：中文问句最常说的就是「生病了怎么办」，而种子正文原先只写
    # 「突发不适 / 看病」—— 用户说的词在库里一个字都找不到（2026-10-06 实测：
    # 「在中国生病了怎么办」hits=0，同一句英文却命中 2 条）。
    sick: ["不舒服", "看病", "生病", "就医"]

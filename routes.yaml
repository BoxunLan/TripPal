# 场景路由配置。图节点只读这里的配置，不硬编码场景文案。
version_pin: "routes@2026.10.06"

classifier:
  version: "cls-0.1.0"
  # 置信度门控阈值
  clarify_below: 0.45      # 最高分 < 0.45：缺槽追问，槽齐走 route.general
  soft_fusion_max: 0.70    # 0.45–0.70：软融合；> 0.70：提交路由

fusion:
  # 叠加层优先级。prompt 顺序同此；输出 Schema 章节顺序跟主场景（置信度最高标签）。
  overlay_priority:
    - safety        # 安全与免责
    - visa          # 签证合规
    - budget        # 预算
    - scene         # 场景体验（family / roadtrip）
  # 多标签权重融合时的权重（同分时的稳定性兜底）
  default_weight: 1.0

retrieval:
  version: "retr-0.1.0"
  top_k: 14
  candidate_multiplier: 6          # 预过滤后先取 top_k * multiplier 再按配额截断
  # 三层配额，需归一到 1.0
  layer_quota:
    general: 0.2
    scene: 0.5
    realtime: 0.3
  # 场景级配额覆盖（visa 提高 realtime）
  layer_quota_overrides:
    visa:
      general: 0.2
      scene: 0.2
      realtime: 0.6
  # 跨语言别名（**只服务检索侧**）：外文问句 → 中文实词。
  # 种子是中文写的，而这一层是**字面**匹配 —— 没有它，外国人用母语问饮食只会拿到
  # 「本库没有相关材料」（真 bug 2026-10-06 菜品探针实测：中 / 英 / 日 / 韩四语问同一
  # 件事，只有中文那句命中）。命中方式是「key 是否出现在原话里」，不做分词，
  # 所以 key 一律写**原形短词**；值里的中文词才真正去和条目正文比对。
  term_aliases:
    vegetarian: ["素食", "斋菜", "素菜", "不吃肉"]
    # 「菜」本身也是高频问法 —— `What local dishes…` / `…cuisine?` 问句里没有 vegetarian
    # 这种专有词，只有 dishes / food，少了这条英文问饮食就一个条目都命中不了
    # （真 bug 2026-10-06 菜品探针 E1：端到端 hits=0，而同会话的 E2 因为有 Sichuan 才命中）。
    dishes: ["菜", "当地菜", "特色菜", "菜系"]
    dish: ["菜", "当地菜", "特色菜"]
    "local dishes": ["当地菜", "特色菜"]
    cuisine: ["菜系", "菜"]
    food: ["菜", "餐饮"]
    vegan: ["素食", "素菜"]
    halal: ["清真"]
    pork: ["猪肉"]
    peanut: ["花生"]
    nuts: ["坚果"]
    allergy: ["过敏", "致敏"]
    spicy: ["辣", "麻辣"]
    sichuan: ["川菜", "四川"]
    "tap water": ["自来水", "饮用水"]
    "street food": ["小吃", "夜市"]
    breakfast: ["早餐"]
    menu: ["菜单", "点菜"]
    # 日文（假名写法的词在中文正文里一个字都对不上）
    料理: ["菜系", "菜"]
    中華料理: ["菜系", "菜"]
    ベジタリアン: ["素食"]
    菜食: ["素食"]
    辛い: ["辣", "麻辣"]
    辛く: ["辣", "麻辣"]
    激辛: ["辣"]
    アレルギー: ["过敏"]
    # 韩文（`음식` 是「食物」，韩文问中国菜最常用它，必须对齐到中文条目里的「菜 / 菜系」）
    음식: ["菜", "菜系", "餐饮"]
    채식: ["素食"]
    매운: ["辣", "麻辣"]
    매워: ["辣", "麻辣"]
    할랄: ["清真"]
    알레르기: ["过敏"]
    # 通用主题：外国人同样会用母语问这些
    subway: ["地铁"]
    metro: ["地铁"]
    "sim card": ["手机卡", "上网"]
    "credit card": ["银行卡", "支付"]
    # 购物 / 退税（2026-10-06 生活场景补种子时加）：问句与主体都要靠它对齐到中文条目
    "tax refund": ["退税", "离境退税"]
    refund: ["退税"]
    "duty free": ["免税", "免税店"]
    duty-free: ["免税", "免税店"]
    bargain: ["砍价", "还价"]
    haggle: ["砍价", "还价"]
    counterfeit: ["假货", "仿品"]
    fake: ["假货", "仿品"]
    receipt: ["发票", "小票"]
    invoice: ["发票"]
    souvenir: ["伴手礼", "特产"]
    shopping: ["购物"]
    silk: ["丝绸"]
    # 就医 / 买药
    hospital: ["医院", "看病"]

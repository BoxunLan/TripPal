  "福州": {type: city, country: "中国", aliases: ["Fuzhou", "푸저우"]}
  "成都": {type: city, country: "中国", aliases: ["Chengdu", "청두"]}
  "青岛": {type: city, country: "中国", aliases: ["Qingdao", "칭다오", "チンタオ"]}
  "大理": {type: city, country: "中国", aliases: ["Dali", "다리"]}
  "丽江": {type: city, country: "中国", aliases: ["Lijiang", "리장"]}

tools:
  # 本期白名单只有这 3 个，RouteConfig.tool_allowlist 之外一律不可调用
  available:
    - opening_hours
    - budget_sum
    - visa_policy

guardrails:
  safety_disclaimer:
    text: "行程为参考建议，出行前请复核天气、交通与景区公告。"
  elder_pacing:
    text: "如同行有长者，请把单日行程压到 2–3 个点，预留午休，避免连续长时间步行。"
  minor_pacing:
    text: "如同行有 6 岁以下儿童，请安排午睡窗口，单日单点之间行车不超过 1.5 小时。"
  visa_not_legal_advice:
    text: "以上为公开信息整理，不构成法律意见；请以使领馆官方公告为准。"

scenes:
  family:
    display_name: 亲子
    prompts: [family.md]
    overlay_slot: scene
    # 不要放单字「岁」：contains 是子串匹配，「70 岁老人」也会命中 family，
    # 进而加载儿童节奏叠加层（午睡窗口）。真正带娃的句子都还有「孩子/小孩/儿童/带娃」可命中。
    keywords: [亲子, 孩子, 小孩, 儿童, 带娃, 宝宝, 幼儿园, 小学, 亲子游, 夏令营,
               kids, kid, child, children, toddler, family, baby,
               家族, 子供, 子ども, こども, キッズ, 가족, 아이, 어린이]
    knowledge_scopes: ["scene:family", "general"]
    tool_allowlist: [opening_hours, budget_sum]
    required_slots: [destination, date_range, budget, party]
    output_schema_id: travel_plan_v1
    guardrail_ids: [safety_disclaimer, minor_pacing]

  budget:
    display_name: 穷游
    prompts: [budget.md]
    overlay_slot: budget
    # 「budget」不能单独作关键词：英文用户只要提一句 "budget 8000" 就被判成穷游场景，
    # 加载青旅/背包客行规。日文「予算」、韩文「예산」同理 —— 它们只是「预算」不是「穷游」。
    # 中文的「省」也太泛（「四川省」会命中），收紧为「省钱」。
    keywords: [穷游, 省钱, 便宜, 每天, 元/天, 低预算, 背包, 青旅, 学生党, 抠,
               low budget, on a budget, budget trip, cheap, shoestring, backpack, hostel, low-cost,
               節約, 安い, 格安, 저렴, 가성비, 알뜰]
    knowledge_scopes: ["scene:budget", "general"]
    tool_allowlist: [budget_sum, opening_hours]
    required_slots: [destination, date_range, budget, party]
    output_schema_id: travel_plan_v1
    guardrail_ids: [safety_disclaimer]

  roadtrip:
    display_name: 自驾
    prompts: [roadtrip.md]
    overlay_slot: scene
    keywords: [自驾, 开车, 租车, 车辆, 高速, 营地, 房车, 山路, 停车,
               roadtrip, road trip, drive, driving, rental car, camper, RV,
               ドライブ, レンタカー, マイカー, 렌터카, 드라이브, 자가용]
    knowledge_scopes: ["scene:roadtrip", "general"]
    tool_allowlist: [opening_hours, budget_sum]
    required_slots: [destination, date_range, budget, party]
    output_schema_id: travel_plan_v1
    guardrail_ids: [safety_disclaimer]

  visa:
    display_name: 签证
    prompts: [visa.md]
    overlay_slot: visa
    keywords: [签证, 免签, 落地签, 材料, 领馆, 大使馆, 出入境, 过境, 申请, 表格,
               visa, visa-free, consulate, embassy, immigration, transit,
               ビザ, 領事館, 大使館, 入管, 비자, 대사관, 영사관, 입국]
    knowledge_scopes: ["scene:visa", "realtime:visa"]
    tool_allowlist: [visa_policy]
    # 关键槽位改为 destination_country，不强制 budget / date_range
    required_slots: [destination_country]
    output_schema_id: travel_plan_v1
    guardrail_ids: [visa_not_legal_advice]
    # 签证场景抬高 realtime 权重
    layer_quota: {general: 0.2, scene: 0.2, realtime: 0.6}

  general:
    # 置信度 < clarify_below 且槽位已齐时的兜底路由
    display_name: 通用
    fallback: true
    prompts: []
    keywords: []
    # `scene:*` = 整层不限场景。绝大多数目的地知识落在 scene 层
    #（种子里厦门 7 条在 scene、只有 3 条在 general），只查 general 会让最常见的
    # 普通请求拿到最少的知识 —— 层配额里给 scene 留的 0.5 也就永远空着。
    # 不拉 realtime：那是签证与时效信息，普通行程规划不需要。
    knowledge_scopes: ["general", "scene:*"]
    tool_allowlist: [opening_hours, budget_sum]
    required_slots: [destination, date_range, budget, party]
    output_schema_id: travel_plan_v1
    guardrail_ids: [safety_disclaimer]

# 意图闸门：在**槽位体检之前**判断这条请求是不是在排行程。
#
# 真 bug 记录：「天安门什么时候升旗」被判成「缺 destination/天数/预算/人数」，回了一句
# 「想去的城市或国家是哪里？计划玩几天？预算是多少？一行几个人？」—— 四个问题全问错了方向。
# 排行程才需要那四个槽位；问事实只需要「问的是什么 + 去哪查」。
#
# 两道闸门**同时**满足才切到实时事实链路：
#   1) 命中下面任一条 realtime 规则；
#   2) 当前这句**没抽出任何行程槽位**（天数 / 预算 / 人数）。
# 第 2 条是「让路」规则：「去厦门 5 天，顺便问下鼓浪屿几点开门」有天数 → 仍按行程走，
# 开放时间由 opening_hours 工具与行前清单承接。
# 判定是确定性的（正则 + 槽位抽取），不调模型。
#
# channels 的 url 都是**实测可达**的，且每条都注明「在哪个栏目查什么字段」。
# 没实测过的入口不写进来 —— 给一个点不开的链接比不给更坏。
# 两条硬规矩（都是被真 bug 教出来的）：
#   1. **name 必须描述点击后落在哪儿**。名字写某个文档、url 写站点根 = 骗人，
#      点开必然跳首页（用户报过这个问题）。
#   2. **region 写入口实际覆盖的范围**，不是「国家」。写「中国」时，杭州的问题
#      也会拿到北京的入口 —— 给错地方的官方入口比不给更坏。
intents:
  realtime_fact:
    display_name: 实时事实
    # 只查实时层。行程知识（scene/general）与「今天开不开门」无关，
    # 混进来会让模型拿旧攻略冒充当日状态。
    scopes: ["realtime:*"]
    triggers:
      - type: schedule        # 仪式 / 演出 / 活动 / 放票的**具体时点**
        attr: 时间
        # kinds = 这一类型只认哪些 metadata.kind 的条目。
        # 少了它，「北京明天天气」会命中 destination=北京 的升旗条目 —— 地点对、类型不对，
        # 而向量检索永远会返回 top_k，它不知道什么叫「不相关」。
        kinds: [rule, schedule, event, procedure]
        re:
          - "(?:什么时候|几点|何时)\\s*(?:升?降?旗|日出|日落|结束|开始|放票|入场|表演|演出)"
          - "(?:升国旗|降国旗|升旗|降旗|开馆|闭馆|开放|营业|开园|闭园|放票|入场|演出|表演)\\s*时间"
          # ⚠️ 不写裸 `when (?:is|are)`：真 bug（2026-10-06 交通探针实测）——
          #    「When is the least busy time to visit?」问的是**人流规律**（常识），
          #    却因为句首的 `when is` 被本闸门当「某个仪式的时点」收走，
          #    再往下就是实时链路（查实时层 → 命中 0 条 → 叫用户自己核）。
          #    它跟「几点升旗 / 几点开门」是两回事。所以英文这条要求
          #    `when (is|are)` 后面**必须紧跟着开放 / 起止这类词**。
          - "what time|opening hours?|when (?:does|do)\\b|when (?:is|are)\\b[^?？]{0,24}\\b(?:open|opened|closed|closing|opening|start|starts|ended|end|ends|begin|begins|sunrise|sunset)\\b"
          # 日语 / 韩语：与上面中英文同义的「开放 / 入馆 / 营业时间」问法。少了它，
          # 「故宮の入場時間は何時ですか」「자금성 개방 시간은 몇 시예요」两道闸门全灭 →
          # 掉回槽位体检被回四连问。真 bug（2026-10-09 多语言对话探针实测）：**同一句英文**
          # 「What are the opening hours of the Forbidden City?」能进本闸门，日/韩不能。
          # ⚠️ 只收「开放/营业 + 时间」的**构造**，不收裸「何時 / 몇 시」——「何時に行けば
          #    空いていますか」（问人流）「혼잡한 시간은?」属常识闸门，别被本闸门抢走。
          - "(?:入場|開場|開館|開園|営業|閉館|閉園|閉場|終了|開始|上演|公演)[^。！？?]{0,6}?(?:時間|時刻|は何時|はなんじ)"
          - "(?:何時|なんじ)(?:から|に)?[^。！？?]{0,12}?(?:開|始ま|終わ|閉ま)"
          - "(?:개방|개장|운영|영업|입장|폐장|폐관|개관|관람)[^。!?？]{0,6}?(?:시간|몇 ?시)"
          - "몇 ?시(?:에)?[^。!?？]{0,12}?(?:문|열|닫|개방|개장|시작|끝)"
      - type: opening_hours   # 今天/明天开不开、有没有临时关闭
        attr: 开放情况
        kinds: [opening_hours, closure, notice]
        re:
          - "(?:今天|明天|今日|明日|现在|什么时候|何时|几点)\\s*(?:还)?\\s*(?:正常)?\\s*(?:开|开放|开门|开园|开馆|营业|关门|闭馆|关闭)"
          - "(?:今天|明天|今日|明日|现在)\\s*(?:还)?\\s*(?:是否|有没有)?\\s*(?:正常)?\\s*(?:开放|营业|开门|闭馆|关闭|停运|停航)"
          - "(?:是否|有没有|还)\\s*(?:正常)?\\s*(?:开放|营业|开门|闭馆|关闭|停运|停航)"
          - "(?:临时|突然|紧急)\\s*(?:关闭|闭馆|停运|停航|管制)"
          - "\\b(?:is it open|open today|closed|temporarily closed)\\b"
      - type: weather         # 天气 / 气温 / 台风
        attr: 天气
        kinds: [weather, forecast]
        re:
          - "(?:天气|气温|温度|降雨|降水|下雨|台风|霾|风力|日出|日落)"
          - "\\b(?:weather|forecast|rain|typhoon|sunrise|sunset)\\b"
      - type: transport       # 交通运营状态
        attr: 运营状态
        kinds: [transport, notice]
        re:
          - "(?:停运|停航|延误|取消航班|封路|限行|管制|轮渡|缆车)"
          - "\\b(?:suspended|service (?:disruption|suspension)|road closure)\\b"
      # 入境政策（产品主题＝外国人来华）：过境免签 / 单方面免签 / 停留期限。
      # 这类是**会变的政策**（国家数、口岸数、施行期限都在动），所以归实时层：
      # 只认带生效日与权威来源的条目，答不出就给官方入口（NIA + 12367 热线），不猜数字。
      # 触发词刻意**不写裸「免签」「签证」**：
      #   ①「哪些国家对中国免签」是出境问题，写裸「免签」会把它误吞成实时事实
      #     （`tests/test_intent.py::test_non_fact_questions_are_not_realtime_intents` 守着这条）；
      #   ②「办泰国签证要准备什么」要走 visa 场景的行程链路，不该被本闸门接管。
      - type: policy
        attr: 免签与入境政策
        kinds: [policy, rule]
        # 相关性判据用**命中的政策名**，不是「命中之前那一截」——
        # 「240 小时过境免签适用哪些国家」切前面会得到一整串原话，
        # 「单方面免签来华能待多久」更是得到空串，两种都必被判成「不相关」。
        relevance: matched
        re:
          - "(?:过境免签|免签入境|免签政策|单方面免签|入境(?:中国|政策)|来华签证|240\\s*小时|144\\s*小时|72\\s*小时)"
          - "\\b(?:visa[- ]free (?:transit|entry)|transit visa[- ]free|240[- ]hour)\\b"
    # 已实测可达的权威入口。查询入口按信息类型给，不按目的地给 ——
    # 目的地太多，宁可给「去哪儿找」的原则 + 已核实的几个。
    # `region` 用于按问题所在地过滤：北京问天气不该看到别的城市的入口。
    # 留空的 region = 全球通用，不过滤。
    channels:
      schedule:
        # name 必须描述**点击后落在哪儿**。原来的写法是名字写《天安门广场升旗仪式观看指南》、
        # url 写站点根 —— 点开必然跳首页，用户报的「跳到网站首页而非对应文件」就是这个。
        # 真实文章页会每日换 id（实测：/article/4TLBR64e2ix 当天是 9月27日那篇），
        # 写死进配置会隔天失效，所以入口只给站点 + 站内搜法，原文链接由命中的条目自带。
        - name: 北京旅游网（站内搜「升旗仪式观看指南」，每日更新；署名 北京市人民政府天安门地区管理委员会）
          url: https://www.visitbeijing.com.cn/
          what: 当日升旗 / 降旗时刻、观旗预约要求与交通线路
          # region 写到**入口实际覆盖的范围**，不是国家。写「中国」时杭州问开门也会拿到这条北京入口。
          region: 北京
      # 日本京都观光导航入口已删（2026-10-05，主题收口为「外国人来华」）。
      # 通用核实入口（region 留空 = 全球通用，不绑定具体城市，不会给错地方）。
      # 没有「全 China 统一」的开放时间 API，所以给「去哪儿查」的原则 + 已实测可达的聚合页，
      # 同时明确最权威口径以具体景区官方渠道当日公告为准（对齐 visa/weather 的官方入口卡片）。
      opening_hours:
        - name: 携程景点详情页（搜景点名 → 「开放时间」栏，含闭馆日与淡旺季调整）
          url: https://you.ctrip.com/sight/
          what: 国内/海外景区当日开放时间、闭馆日与临时调整；最权威口径以具体景区官方渠道（官网/官方公众号/小程序）当日公告为准
          region: ""
      weather:
        - name: 中国天气网（中国气象局公共气象服务中心）
          url: https://www.weather.com.cn/
          what: 国内城市逐日预报与预警信号
          region: 中国
      transport: []   # 未实测到通用入口：停运/限行一律以运营方当日公告为准，不猜
      # 入境政策的权威入口是**国别级**的（不随目的地城市变），所以 region 留空 = 全球通用。
      # 240 小时过境免签的官方口径本身在动（NIA 57 国/65 口岸、旧转载页 55 国/60 口岸），
      # 因此入口给「到哪查现行口径」，而不是把某一版数字当结论。
      policy:
        - name: 国家移民管理局 过境免签政策（含适用国家与 65 个口岸清单）
          url: https://www.nia.gov.cn/n741440/n741577/c1731205/content.html
          what: 240 小时 / 24 小时过境免签的适用国家、口岸与停留区域
          region: ""
        - name: 国家移民管理局官网（站内搜「免签政策」「公告」，看最新生效日期）
          url: https://www.nia.gov.cn/
          what: 单方面免签、过境免签、区域性免签的最新公告与生效日期；12367 热线
          region: ""

  # 「西湖有多大」这类**静态事实问询**：不随时间变，也不是排行程。
  # 没有这一节它会掉回 clarify 的槽位体检 → 回「目的地/天数/预算/人数」四问。
  # 这与「天安门什么时候升旗」是同一个错误的两种形态：把「问事实」当成了「排行程」。
  #
  # 判定只用疑问句式，**不靠名词** —— 认名词的话「厦门」两个字就会被吞掉。
  # 让路规则两条：已经在排行程（有槽位）、或句中出现规划动词 → 不走本闸门。
  knowledge_question:
    display_name: 常识问答
    triggers:
      # 度量 / 规模
      - "(?:有多大|多高|多长|多宽|多深|多远|面积|周长|海拔|人口|多少公里|多少千米|多少米|多少年历史)"
      # 时间 / 归属 / 来由
      - "(?:在哪(?:里|儿|个城市)?|是哪一年|哪一年|哪年|建于|始建于|建成(?:于)?|成立(?:于|时间)|什么时候建的|是谁|属于哪)"
      # 定义 / 成因
      - "(?:是什么|为什么|怎么(?:形成|来的)|由来|历史渊源|有什么(?:区别|不同))"
      # 目的地咨询：既不排行程、也不是要一个会变的当日状态，只是想了解这个地方。
      # 真 bug（2026-09-28 用户报）：这几句原先掉回 clarify 的槽位体检，被回以
      # 「缺 日期 / 预算 / 人数」三问 —— 「厦门有什么好吃的」跟预算有什么关系？
      - "(?:有什么(?:好吃|好玩的|好玩|特色|值得)|好玩吗|值得去吗|好不好玩|怎么样|介绍一下|说说|想了解)"
      # 「景点推荐呢 / 推荐一下美食」—— 也是「要了解这个地方」，只是语序反了。
      # 收纳它的真正目的不只是"能答"：命中片段落在句首时会被当成**这一句自带的主体**
      # （见 `intent.detect_knowledge_intent` 的 `own_subject`），从而**拒绝被上一轮承接覆盖**。
      # 真 bug（2026-10-06 变卦探针实测）：F10 会话「支付怎么弄」答完后「景点推荐呢」，
      # 因为没有任何触发词命中、走了承接兜底 → 主体变成上一轮的「支付怎么弄」，问景点答支付。
      - "(?:景点|美食|餐厅|小吃|路线|线路)(?:推荐|有哪些|有什么)"
      - "推荐(?:一下)?(?:的)?(?:景点|美食|餐厅|路线|线路)"
      # 来华实用问答（支付 / 上网 / 交通 / 退税 / 住宿接待）：既不排行程、也不是当日状态，
      # 归常识链路（模型作答 + 「未经本知识库核实」标注 + 复核入口）。
      # 触发词仍**不写「酒店 / 住宿 / 机票 / 签证」**：让路规则先跑，写在这里也会被压掉。
      # 但「机票 / 酒店 / 住宿」已从 `plan_verbs` 挪到 `plan_topics` —— 只挡祈使句、
      # 不再挡疑问句，所以「住酒店要注意什么」这类问句照样能进本闸门（靠「什么」命中）。
      # 「签证」留在 plan_verbs：它有独立的 visa 场景链路。
      - "(?:外卡|境外卡|境外银行卡|国际信用卡|信用卡|银联卡|扫码支付|移动支付|支付宝|微信支付|取现)"
      - "(?:能不能|可以|能用|支持|怎么|如何).{0,10}(?:支付|付款|刷卡|结账|买单)"
      # 语序反过来的同一类：「支付怎么弄」「付款怎么操作」—— 疑问词在主题词**之后**。
      # 真 bug（2026-10-06 变卦探针实测）：会话里已有目的地时，「支付怎么弄」四道闸门全灭
      # → 掉回槽位体检 → 把已经在聊的行程四问又刷了一遍。
      - "(?:支付|付款|刷卡|结账|买单).{0,8}(?:怎么|如何|怎么办|怎么弄|弄|搞|操作|能?用吗|可以吗)"
      # ⚠️ `流量` 必须避开「人流量」：真 bug（2026-10-06 交通探针 T3-B3）——
      #    「国庆期间景区人流量大吗」是本闸门里靠前的**上网**词先命中（`流量`），
      #    主体因此被切成「国庆期间景区人」，卡片标题也跟着半截。
      #    加一个「前面不是『人』」的断言，人流量留给下面的交通情况那条。
      - "(?:上网|(?<!人)流量|手机卡|电话卡|漫游|随身\\s*Wi-?Fi|eSIM|SIM\\s*卡)"
      - "(?:高铁票|火车票|12306|地铁票|地铁|乘车码|挥卡过闸)"
      - "(?:离境退税|退税|免税店)"
      - "(?:涉外资质|接待外国人|接待外宾|拒接外宾)"
      # **日常功能话题**（2026-10-06 日常功能探针实测）：地铁怎么坐 / 手机怎么支付 / 打车用什么
      # 软件 / 共享单车怎么租 / 高铁怎么买票 / 手机没网怎么办 —— 来华旅客落地后最先要解决的一批。
      # 补之前有 4 题**四道闸门全灭**（「打车用哪个软件」「中国高铁怎么买票」「怎么租共享单车」
      # 「手机没网怎么办」）→ 掉回槽位体检被回四连问。补法同文化那批：按**出行方式 + 工具名**收，
      # 不逐句补。「高铁票」那条已在上面，这里兜住没带「票」字的问法（「中国高铁怎么买票」）。
      # 规划动词（`plan_verbs`）在 triggers **之前**跑，「规划一条地铁沿线 3 天的行程」照旧走行程。
      - "(?:地铁|轻轨|公交|巴士|有轨电车|轮渡|摆渡|磁悬浮|换乘|末班车|首班车)"
      - "(?:打车|打的|叫车|网约车|出租车|滴滴|顺风车|专车|打车软件|叫车软件)"
      - "(?:共享单车|单车|自行车|共享充电宝|充电宝|电动车|滑板车|租车)"
      - "(?:高铁|动车|火车|12306|城际|卧铺|站票|二等座|一等座)"
      - "(?:怎么|如何|怎样|哪里|哪儿|在哪)[^。！？!?]{0,8}?(?:买票|购票|订票|买|预订|充值|退票)"
      - "(?:没网|没有网|上不了网|连不上网|没信号|没有信号|断网|网络|信号|(?<!人)流量|Wi-?Fi|WIFI|无线网|热点|上网卡)"
      - "(?:插头|插座|电压|充电|扫码|二维码)"
      - "(?:翻译|语言不通|看不懂|问路|导航|高德|百度地图)"
      - "\\b(?:metro|subway|taxi|didi|ride[- ]?hailing|shared bike|bike[- ]?sharing|bullet train|train ticket|wifi|wi-fi|qr code|power bank|charger|navigate|translation app)\\b"
      - "(?:地下鉄|電車|バス|タクシー|配車|自転車|シェアサイクル|新幹線|チャージ|QRコード|翻訳|決済|支払|スマホ決済|キャッシュレス|Wi-?Fi|ネット|インターネット|SIM)"
      - "(?:지하철|버스|택시|자전거|공유 자전거|기차|고속철|와이파이|QR코드|충전|번역|결제|지불|페이|현금|카드|인터넷|유심|데이터)"
      # 交通**情况**（高峰 / 拥堵 / 人流量）—— 与上面「怎么坐」不是一类：问的是
      # **什么时候最挤、哪种方式快、人多不多**，句子可以一个交通名词都不带
      # （「故宫一般什么时候人最多」「観光地は週末混みますか」）。
      # 真缺口（2026-10-06 交通探针实测）：这类问句原先**一个触发词都没有** ——
      #   中文「故宫什么时候人最多」掉四连问；日文「観光地は週末混みますか」靠承接
      #   借了上一轮的**韩文**主体（「지하철」），整段答案于是写成了韩文。
      # 补的是「情况词」本身：拥挤 / 人流 / rush hour / 混雑 / 혼잡，以及排班（班次）。
      # plan_verbs 仍在其前跑，「规划一条避开早晚高峰的三天行程」照旧走行程链路。
      - "(?:高峰|早高峰|晚高峰|高峰期|拥堵|堵车|堵不堵|人流|人流量|客流|拥挤|挤不挤|人山人海|什么时候人(?:最)?多|几点人(?:最)?(?:多|少)|人(?:最)?多的时候|避开人流|错峰|限流|排队|班次|发车间隔)"

  "新加坡": {type: country, country: "新加坡", aliases: ["Singapore", "싱가포르", "シンガポール"]}
  "马来西亚": {type: country, country: "马来西亚", aliases: ["大马", "Malaysia", "말레이시아", "マレーシア"]}
  "吉隆坡": {type: city, country: "马来西亚", aliases: ["Kuala Lumpur", "쿠알라룸푸르", "クアラルンプール"]}

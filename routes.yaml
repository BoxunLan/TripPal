  "澳大利亚": {type: country, country: "澳大利亚", aliases: ["澳洲", "Australia", "호주", "오스트레일리아", "オーストラリア"]}
  "墨尔本": {type: city, country: "澳大利亚", aliases: ["Melbourne", "멜버른", "メルボルン"]}
  "悉尼": {type: city, country: "澳大利亚", aliases: ["Sydney", "시드니", "シドニー"]}
  "申根区": {type: "region", country: "申根区", aliases: ["申根", "Schengen", "솅겐", "쉥겐", "シェンゲン"]}
  "法国": {type: country, country: "法国", aliases: ["France", "프랑스", "フランス"]}

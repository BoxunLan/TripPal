  "意大利": {type: country, country: "意大利", aliases: ["Italy", "이탈리아", "イタリア"]}
  "罗马": {type: city, country: "意大利", aliases: ["Rome", "로마", "ローマ"]}
  "西班牙": {type: country, country: "西班牙", aliases: ["Spain", "스페인", "スペイン"]}
  "土耳其": {type: country, country: "土耳其", aliases: ["Turkey", "터키", "トルコ"]}
  "伊斯坦布尔": {type: city, country: "土耳其", aliases: ["Istanbul", "이스탄불", "イスタンブール"]}
  # origin_only：出发地/国籍语境，不算目的地。
  # 「哪些国家对中国免签」里的中国是签发护照的国家，不排除它 destination 会变成中国，
  # 然后输出一篇关于中国签证的稿子。
  "中国": {type: country, country: "中国", origin_only: true, aliases: ["China", "중국"]}
  # 地标别名归到所在城市：用户问的是「天安门」「故宫」，不是「北京」。
  # 少了这层映射，「天安门什么时候升旗」一个地名都抽不到 → 被当成缺 destination。
  # 中英双语都要给：英文用户写 Tiananmen 时也得解析出地点，否则连权威入口都筛不出来。
  "北京": {type: city, country: "中国",
           aliases: ["Beijing", "베이징", "북경", "ペキン", "天安门", "故宫", "颐和园", "天坛", "长城",

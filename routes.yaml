      - "(?:免签|落地签|过境签|签证|入境)[^。！？!?]{0,8}?(?:能|[待在]|停留|逗留|滞留)[^。！？!?]{0,8}?(?:多久|多长时间|多少天|几天|期限)"
      - "(?:停留|逗留|滞留)[^。！？!?]{0,6}?(?:期限|时间|多久|多长时间|多少天|几天)"
      # 「怎么走」类交通问句（「从浦东机场怎么到市区」「怎么去外滩」）。
      # 真 bug（2026-10-06 变卦探针实测）：「从浦东机场怎么到市区」出了一份
      # 「上海浦东机场到市区交通方式及路线（5 天参考行程）」—— 问的是**怎么走**，不是排行程。
      # 排在「高铁票 / 地铁」那条之后：具体票务词优先，这条兜住没提票种的问路句。
      - "(?:机场|火车站|高铁站|车站|码头|市区|景点|博物馆|大学)[^。！？!?]{0,10}?(?:怎么(?:走|去|到|坐车|乘车|过去)|如何(?:去|到|走)|怎样(?:去|到))"
      - "(?:怎么|如何|怎样)[^。！？!?]{0,10}?(?:从|到|去)[^。！？!?]{0,12}?(?:机场|市区|车站|景点)"
      # **当地文化特色**（2026-10-06 文化探针实测）：礼仪 / 习俗 / 禁忌 / 小费 / 寺庙 / 节日
      # 这类是来华客群的高频诉求，原先**没有任何触发词**接住 → 中文「中国的小费文化是怎样的」
      # 「进寺庙要注意什么」回四连问；英文 8 题里 5 题回四连问；「What are the customs during
      # Chinese New Year?」更糟 —— 会话槽位已齐，被当**排行程**直接重排了一份新稿（问习俗，
      # 给行程）；日 / 韩同类问题 4/4 全掉四连问。
      # 规划动词（`plan_verbs`）在 triggers **之前**跑，所以「体验茶文化，玩三天」照旧走行程。
      - "(?:礼仪|礼节|礼数|习俗|风俗|传统|讲究|禁忌|忌讳|小费|服务费|红包|送礼|伴手礼|寺庙|庙宇|拜佛|烧香|上香|宗教|少数民族|节日|庙会|过年|春节|中秋|端午|元宵|清明|京剧|戏曲|茶道|中医|养生|风水|生肖|广场舞|汉服|旗袍|筷子|敬酒|劝酒|干杯|砍价|讨价还价)"
      # 通用「注意事项」问句（不限文化）：「进寺庙要注意什么」「带小孩要注意什么」
      - "(?:要|需要|得|应该)(?:注意|当心|小心|留意)(?:什么|哪些|点什么|些什么)"
      - "\\b(?:etiquette|manners?|customs?|traditions?|taboos?|tipping|tips?|red envelope|chopsticks|tea ceremony|kung fu|festivals?|spring festival|chinese new year|lunar new year)\\b"
      # 英文「为什么…」在句首时原来的 `why (?:is|are)` 接不住 do / does / did
      - "\\bwhy (?:is|are|do|does|did|would|can)\\b"
      # 日文 / 韩文的同一批文化词
      - "(?:マナー|礼儀|習慣|風習|伝統|タブー|禁忌|チップ|春節|旧正月|正月|茶道|民族)"
      - "(?:예절|매너|전통|관습|금기|팁|춘절|설날|한복|치파오|전통 의상)"
      # ── 应用与网络服务（境外 App 不可用 / 地图导航 / 扫码）：来华最高频的落地问题之一
      - "(?:谷歌|Google|谷歌地图|高德|百度地图|导航|地图软件|打车软件|滴滴|什么(?:应用|软件|App)|装(?:什么|哪些)(?:应用|软件)|微信(?:怎么用|怎么装)|小程序|扫码点(?:单|餐)|翻墙|VPN|境外(?:应用|软件|网站)用不了)"
      - "\\b(?:google|gmail|youtube|whats ?app|instagram|facebook|does (?:google|whatsapp) work|vpn|blocked|which app|best app|navigation app|ride[- ]hailing|didi|amap|baidu maps?|qr code|scan to order|mini[- ]program)\\b"
      - "(?:グーグル|Google|google|グーグルマップ|高徳|バイドゥ|百度|ナビ|地図アプリ|配車アプリ|滴滴|アプリ|微信小程序|QR|スキャン|使える|使えない)"
      - "(?:구글|고덕|바이두|지도 앱|내비|내비게이션|택시 앱|디디|앱|어플|위챗|QR|스캔|사용 가능|안 됨)"
      # ── 天气 · 季节 · 穿衣 · 空气
      - "(?:天气|气温|冷不冷|热不热|下雨|雨季|梅雨|台风|雾霾|空气污染|空气质量|AQI|穿(?:什么|多少|多厚)|带什么衣服|几月(?:去|来|份)|什么时候去|最佳(?:季节|时间|月份)|淡季|旺季)"
      - "\\b(?:weather|how cold|how hot|rain|rainy season|typhoon|air quality|pollution|aqi|what to wear|what should i wear|best time to visit|best month|shoulder season|pack(?:ing)? (?:for|list))\\b"
      - "(?:天気|気温|寒|暑|雨|梅雨|台風|霧|大気汚染|空気|PM2|服装|服|何を着|何月|いつ行|ベストシーズン)"
      - "(?:날씨|기온|춥|덥|비|장마|태풍|미세먼지|공기|대기오염|옷|복장|몇 월|언제 가|여행하기 좋은)"
      # ── 安全 · 紧急 · 遗失 · 骗局
      - "(?:安全(?:吗|不)?|治安|危险|报警|报案|警察|急救|救护车|火警|丢了|丢失|遗失|被盗|被偷|扒手|小偷|骗局|骗人|套路|宰客|黑车|使馆|领事|领保|110|119|120|12308)"
      - "\\b(?:is it safe|safety|dangerous|crime|scam|scams|tourist scam|rip[- ]off|overcharge|pickpocket|theft|stolen|lo(?:se|st) (?:my )?(?:passport|wallet|phone)|emergency|call the police|police|ambulance|embassy|consulate)\\b"
      - "(?:安全|治安|危険|盗|盗ま|なくした|紛失|スリ|詐欺|ぼったくり|ぼったく|警察|救急車|緊急|大使館|領事館|110番)"
      - "(?:안전한|안전해|안전합|치안|위험|도난|분실|잃어버|소매치기|사기|바가지|경찰|구급차|응급|대사관|영사관|112)"
      # ── 节假日 · 黄金周 · 闭馆 · 错峰
      - "(?:国庆|十一|黄金周|春节|过年|元旦|五一|劳动节|清明|端午|中秋|法定(?:假日|节假日)|放假|调休|闭馆|周一|人(?:多|挤|山人海)|避开(?:人流|高峰|人群)|错峰|放票|抢票)"
      - "\\b(?:golden week|national day|october 1|chinese new year|spring festival|lunar new year|public holiday|holiday (?:week|rush)|closed on mondays?|monday closure|too crowded|avoid crowds|off[- ]peak|booking opens|tickets? (?:sell|sold) out)\\b"
      - "(?:国慶節|国慶|ゴールデンウィーク|春節|旧正月|旧暦|連休|休日|祝日|月曜|休館|混雑|混む|空いて|ピーク|予約開始|完売)"
      - "(?:국경절|국경일|춘절|설날|춘절|연휴|공휴일|휴일|월요일|휴관|혼잡|붐비|피크|예약 오픈|매진)"
      # ── 语言 · 英文标识 · 翻译 · 实用短句
      - "(?:英文(?:标识|标牌|招牌|菜单|报站)?|英语(?:通用|能(?:用|沟通)|沟通)?|(?:说|讲)(?:中文|汉语|普通话|英文|英语)|中文(?:不会|不行|水平)|沟通|语言不通|翻译(?:软件|App|工具)?|拍照翻译|离线翻译|路牌|指路|问路)"
      - "\\b(?:english|do (?:people |they )?speak english|language barrier|translate|translator app|translation app|signage|signs in english|menu in english|how do i (?:ask|say)|phrase)\\b"
      - "(?:英語|英語表示|英語の案内|中国語|通じ|言葉|言語|翻訳|翻訳アプリ|案内表示|道を聞|道案内)"
      - "(?:영어|영어 표지|중국어|통하|언어|번역|번역 앱|안내 표지|길을 묻|길찾기)"
      # —— 通用英语疑问式（2026-10-08 外文探针补）——
      # 真 bug：英文问句「What food is Beijing famous for」/「What exhibitions are at the
      # National Museum of China」既不命中上面那些**话题专属**英文触发词，句子又没带问号
      # （consult 兜底看 `consult_question` 的 `[?？]`），于是整句掉回 clarify 四连问；
      # 而中文同义句（「北京有什么好吃的」「国家博物馆有什么展览」）走的是常识链路 ——
      # 同一句话中英两个结果。下面是**言语行为**模式（在问事），不是话题词，故与上面并列。
      # 让路规则照旧先跑（有天数/预算的句子仍走行程），实时闸门也**先于**本闸门判
      # （`app/graph.py::clarify_node`），所以「What are the opening hours…」仍归实时。
      - "\\bwhat (?:food|dishes?|cuisine|specialt(?:y|ies)|sights?|attractions?|things|places|museums?|exhibitions?|landmarks?)\\b"
      - "\\bwhat (?:is|are|'s) (?:there )?to (?:do|see|eat|visit|buy|try)\\b"
      - "\\bwhat(?:'s| is| are) .{0,24}\\b(?:famous|known|popular|renowned|best known) for\\b"
      - "\\btell me about\\b"
      - "\\bwhat (?:is|are) the (?:best|must[- ]see|highlights?|main|top)\\b"
      - "\\bwhere (?:can|do|should) (?:i|we)\\b"
      - "\\bwhy (?:is|are|do|does|did)\\b"
    # 出现任一 = 用户在排行程 → 本闸门让路（有天数/预算的句子优先按行程处理）。
    # 「推荐」必须后接行程名词才算规划：「厦门有什么好吃的，推荐一下」是在问吃的。
    # 「签证」**留在这里但收窄到「办理语境」**：它有一条专门的下游 —— visa 场景出的是
    # 「材料清单 + 官方链接 + 生效日」，那比通用常识更像正经答案，所以「办泰国签证要准备
    # 什么」必须继续让路（`tests/test_intent.py::test_visa_questions_stay_on_the_visa_chain`
    # 守着这条）。但**裸「签证 / 免签」不该让路**：那是把话题名词当成了动作。
    # 真 bug（2026-10-06 变卦探针实测）：会话里已有 destination_country（「中国」）时，
    # 「外国人需要签证吗」被放行进行程链路 → 槽位体检不缺槽 → **直接出了一份
    # 「西安 4 日行程（含来华签证办理要点）」**。用户问的是政策是非，得到的却是行程。
    # 判据与 plan_topics 一致 —— 看**言语行为**：问政策走常识闸门，要办事才让路。
    plan_verbs:
      - "(?:规划|安排|行程|路线|攻略|(?:怎么|怎样|如何)玩|带我|推荐(?:一下)?(?:行程|路线|景点)|预算|几天|几日|去.{1,8}玩|自由行|跟团)"
      # 办理语境才让路：动词在「签证」前（办/申请/准备…），或「签证」后接办理名词
      # （签证材料 / 签证流程 / 签证怎么办 / 签证需要什么）。裸「签证吗 / 需要签证吗」不匹配。
      - "(?:(?:办|申请|办理|准备|提交|预约|加急|面签|领馆|大使馆|使领馆).{0,8}签证|签证(?:材料|流程|费用|加急|怎么(?:办|申请)|要(?:准备|什么)|需要什么|申请|办理))"
      # 英文里 `visa` **刻意不在**让路清单里：英文没有 visa 场景链路，放行只会让
      # 「Do I need a visa?」掉进通用行程（实测出了一份 1 天假行程）。让它进 knowledge 闸门。
      - "\\b(?:plan|itinerary|trip to|budget)\\b"
    # **主题名词**：只说明「这件事跟机票 / 酒店 / 住宿有关」，不说明「要排行程」。
    # 真 bug（2026-10-04 用户报）：「外国人在中国住酒店要注意什么」原先因为这里混着
    # 「酒店」被整条让给了行程链路 → 回一句「想去的城市？玩几天？预算多少？一行几个人？」。
    # 问注意事项是**问事**，不是要我订房。判据因此改成**言语行为**：
    # 疑问句不让路，祈使句（「帮我订个酒店」）才让路。
    plan_topics:
      - "(?:机票|酒店|住宿)"
      - "\\b(?:hotel|flight)\\b"
    # 兜底闸门：triggers 都没命中、但句子里有明确目的地、且是疑问/咨询语气时，
    # 也归常识问答（「厦门的鼓浪屿有意思吗」）。两条让路规则（槽位 / 规划动词）同样先跑，
    # 所以「去厦门」这种没有疑问语气的出行意图仍然走行程链路。
    consult_fallback: true
    # 「怎么 / 怎样」要收：真 bug（2026-10-04）「上海的地铁怎么坐」既不命中 triggers
    # （库里只有「地铁票」没有「地铁」），也不命中这里的旧清单 → 掉回槽位体检回四连问。
    # 规划动词（`plan_verbs`）仍然先跑，所以「怎么玩」不会被这条收走。
    consult_question: "(?:[?？]|吗|呢|怎么样|多少|什么|哪|如何|怎么|怎样|是不是|值得|介绍|说说|了解|有没有|有哪些|免费|门票|收费|预约)"
    # 常识问答只查这些层。realtime 是当日状态，对本类问题没有意义。
    scopes: ["scene:*", "general:*"]
    # 核实入口：答案由通用常识给出、**未经本知识库核实**，必须让用户能自己复核一遍。
    # 用通用检索而不是具体站点：常识问题的主题是无限长尾，没有可枚举的官方站点；
    # 而且检索式会把查询词一起带过去，落点就是结果页 ——
    # 不会出现「名字承诺一份文档、点开却是首页」那种名实不符。
    # 实测 2026-09-28：cn.bing.com/search 对全部样例返回 200、标题即查询词。
    # （zh.wikipedia.org 本机 SSL 握手超时；baike.baidu.com 返回 403 —— 都不可用。）
    verify:
      name: "Bing 搜索「{query}」"
      url_template: "https://cn.bing.com/search?q={query}"
      what: 面积 / 海拔 / 人口 / 历史等词条级事实的复核
    # 不给具体文档级入口：行程知识库没有这类词条，硬凑一个等于把「没有」包装成「去别处查」。
    channels: {}

  # 第三道前置闸门：**寒暄 / 闲话 / 元问题**（「你好」「在吗」「谢谢」「你是谁」）。
  # 没有这一节，任何非行程、非事实的短句都会掉进槽位体检 → 被回「目的地？天数？预算？人数？」
  # 四连问（用户实测报出）。这类输入要的是一句话的**引导**，不是一份需求表单。
  #
  # 判定确定性，且刻意**只在短句上生效**（见 `app/intent.py:detect_social_intent`）：
  # ① 命中下面的正则；② 消息很短；③ 没解析出目的地；④ 没有行程动词 / 行程槽位。
  # 后两条是关键 —— 「你好，我想去上海玩 3 天」仍是行程请求，不能被这句寒暄吞掉。
  #
  # 答复由**通用模型**按 `prompts/guide.md` 生成（问候 + 说明能帮什么 + 邀请提问），
  # 模型不可用时退回 i18n 里的定稿文案。它既不是行程也不是事实断言，故不检索、不受时效闸约束。
  social:
    display_name: 寒暄与引导
    # 短句上限（字符数）。超过它就不像寒暄了 —— 长消息更可能是真请求。
    # ⚠️ 这与「长消息不算寒暄」那条用例是一对：中文 24 字以上**一律不走寒暄**
    # （「你好啊我最近在计划一场很长很长的旅行你能帮我看看吗」= 26 字，里面是真请求）。
    # 但这个阈值对**非中文**不合适：一个词就好几个字母，「Bonjour, comment allez-vous ?」
    # 只有 3 个词、纯客套，却已经 29 字符，按 24 会被挡在门外掉进四连问
    # （2026-10-08 外文探针实测）。所以非中文（无汉字）单独给一个**词数尺度**的上限。
    max_chars: 24
    max_chars_latin: 48
    triggers:
      - kind: greeting
        re:
          - "^(?:你好|您好|你们好|嗨|哈喽|哈啰|喂|在吗|在不在|有人吗|早上好|中午好|下午好|晚上好|早安|晚安)"
          - "^(?:hi|hello|hey|yo)\\b"
          # 多语种寒暄（2026-10-08 外文探针补）。真 bug：日语「こんにちは」、韩语
          # 「안녕하세요」、法语「Bonjour」、西语「Hola」都掉进 clarify 四连问 ——
          # 而回复话术还是用对语言的，等于用对方的母语问「你预算多少」，尤其刺眼。
          # 一律**句首锚定**（与中英同一口径）：「Thanks, now plan my trip to Beijing」
          # 这种带着正事的开头不会被这声招呼吞掉（后面还有目的地/槽位两道让路）。
          - "^(?:こんにちは|こんばんは|おはよう|はじめまして|どうも|やあ|もしもし|안녕하세요|안녕|반갑습니다|여보세요)"
          - "^(?:bonjour|bonsoir|salut|coucou|all[ôo]|hola|buenos d[íi]as|buenas (?:tardes|noches)|qu[ée] tal|hallo|guten (?:tag|morgen|abend)|servus|moin|ciao|buongiorno|buonasera|salve|привет|здравствуйте)\\b"
      - kind: thanks
        re:
          - "(?:谢谢|多谢|感谢|谢了|辛苦了|thanks|thank you|thx)"
          - "(?:ありがとう|どうもありがとう|感謝|감사합니다|고맙습니다|감사|merci(?: beaucoup)?|gracias|muchas gracias|danke(?: sch[öo]n)?|vielen dank|grazie|спасибо)"
      - kind: farewell
        re:
          - "(?:再见|拜拜|回见|bye|goodbye|see you)"
          - "(?:さようなら|さよなら|またね|じゃあね|バイバイ|안녕히 가세요|잘 가|또 봐|au revoir|[àa] bient[ôo]t|adieu|adi[óo]s|hasta luego|chao|auf wiedersehen|tsch[üu]ss|bis (?:bald|sp[äa]ter)|arrivederci|до свидания|пока)"
      # 「算了不去了 / 取消行程」= 用户**放弃**这次规划。真 bug（2026-10-06 变卦探针实测）：
      # 说出来之后系统把同一个四连问原样又刷了一遍 —— 用户刚说「不去了」，系统还在问
      # 「玩几天？预算多少？」。这与寒暄同源，属「不是排行程的请求被当成排行程」。
      # 判据必须**整句**锚定（^…$）：只要句尾还有别的内容（「算了，先问下签证」）就不算放弃，
      # 否则会把后面真正的问题一起吞掉。plain「算了」刻意不收（可能是「预算算了，你定」）。
      - kind: cancel
        re:
          - "^(?:那|这|就)?(?:算了)?[，,、 ]*(?:不去了|不想去了|不去玩了|不玩了|不去了吧|先不去了|取消(?:行程|计划|这次)?)(?:吧|了|啊)?[。！？.!?]*$"
          - "^(?:cancel(?: the)? (?:trip|plan)|never ?mind|forget it|changed my mind)[.!]*$"
      - kind: meta
        re:
          - "(?:你是谁|你叫什么|你的名字|你是什么|你是干什么|你能做什么|你能干什么|你会什么|你懂什么|帮我做什么|who are you|what can you do|what are you)"
      # 元问题里的**记忆类**：问「我们刚才聊了什么」。它必须由会话历史**确定性**回答，
      # 不能交给模型 —— 模型看不到历史时会编，看得到历史时也可能答歪，而这句话的
      # 唯一正确来源就是我们自己记的那几轮（真 bug 2026-10-04：「刚才我说了什么」
      # 掉进槽位体检，回的是四连问）。
      - kind: recall
        re:
          - "(?:刚才|刚刚|之前|前面|上面|我们|咱)[^。！？?]{0,6}(?:说|聊|问|讲|提)[^。！？?]{0,4}(?:什么|啥)"
          - "(?:我说了什么|聊到哪|说到哪|还记得吗|记得我说)"
          - "\\b(?:what did i (?:just )?(?:say|ask)|what (?:were|are) we (?:talking|discussing) about)\\b"
      # 第九形态（2026-10-09 用户报）：**纯笑声 / 字母数字梗**（「哈哈哈」「呵呵」「嘿嘿」
      # 「233」「lol」）同样属于「不是排行程的请求」。旧行为掉进槽位体检 → 回四连问：
      # 用户笑一声，系统递上一张需求表单，比「你好」那次更出戏。
      # 一律**整串锚定**（^…$）：句中只要还有别的内容（「哈哈，帮我排个上海的行程」）就不算，
      # 后面还有「有目的地 → 不算」与「有槽位 / 规划动词 → 让路」两道兜底。
      - kind: chitchat
        re:
          # 中文笑声：笑声字符 ≥2 个（可混用，如「哈哈嘿」），句尾可带语气词 / 标点；
          # 单个「哈」不收（可能是语气词）。
          - "^[哈嘿嘻呵嘎噗吼]{2,}[了啦呀啊哦吧嘞哟！!。.～~]*$"
          # 常见整句笑法 + 句尾语气词
          - "^(?:笑死(?:我了|我|个人|啦)?|笑不活了|太逗了|好逗|好好笑|好搞笑|乐死我了|笑麻了|绝了)[了啦呀啊哦吧嘞哈]*[！!。.～~]*$"
          # 字母梗（hhh / www）。**不含 233 / 666** —— 裸数字会被槽位抽取器读成预算
          # （实测 "233" → budget=233），那就该按「用户给了数字」处理，不是笑声。
          - "^(?:[hH]{3,}|[wWｗ]{3,})$"
          # 拉丁笑声
          - "^(?:ha(?:ha)+|he(?:he)+|hi(?:hi)+|lol|lmao|rofl|kekw?|xd|aww+)$"
          # 日 / 韩笑声
          - "^(?:ｗ{2,}|ww+|笑{2,}|草{2,}|ㅋ+|ㅎ+)$"

